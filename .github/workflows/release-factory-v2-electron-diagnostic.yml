name: Release Factory V2 Electron Diagnostic

on:
  push:
    branches:
      - feature/release-factory-v2
    paths:
      - '.github/workflows/release-factory-v2-electron-diagnostic.yml'
  workflow_dispatch: {}

permissions:
  actions: read
  contents: read
  statuses: write

jobs:
  electron-diagnostic:
    name: Verify formal Electron packaging entry
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      MIRA_RELEASE_ALLOW_FAILED_TESTS: '1'
      DIAGNOSTIC_SOURCE_COMMIT: a3add7275d24d9beca45a1b293e971c0539a5272
      DIAGNOSTIC_SOURCE_RUN_ID: '30323595789'
      DIAGNOSTIC_PAYLOAD_NAME: release-benchmark-payload-windows-x64-a3add7275d24d9beca45a1b293e971c0539a5272
    steps:
      - name: Publish diagnostic pending status
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              context: 'release-factory-v2-electron-diagnostic',
              description: 'Formal Electron packaging verification is running',
              target_url: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
            });

      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: pnpm/action-setup@v3
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Cache Electron builder
        uses: actions/cache@v4
        with:
          path: |
            ~/AppData/Local/electron-builder/Cache
            ~/.cache/electron-builder
          key: windows-release-factory-electron-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            windows-release-factory-electron-

      - name: Install Electron packaging tools
        run: pnpm install --frozen-lockfile --prefer-offline --filter ui-chat-mira

      - name: Download frozen benchmark payload
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.DIAGNOSTIC_PAYLOAD_NAME }}
          path: .artifacts/release-payload/windows-x64
          github-token: ${{ github.token }}
          run-id: ${{ env.DIAGNOSTIC_SOURCE_RUN_ID }}

      - name: Package through formal Electron command
        id: package
        shell: pwsh
        env:
          GITHUB_SHA: ${{ env.DIAGNOSTIC_SOURCE_COMMIT }}
        run: |
          $timer = [System.Diagnostics.Stopwatch]::StartNew()
          try {
            pnpm release:package:electron:win
            if ($LASTEXITCODE -ne 0) {
              throw "Formal Electron packaging failed with exit code $LASTEXITCODE"
            }
          } finally {
            $timer.Stop()
            "elapsed_seconds=$([math]::Round($timer.Elapsed.TotalSeconds))" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }

      - name: Verify Electron package outputs
        id: verify
        shell: pwsh
        run: |
          $outputRoot = Join-Path $PWD '.artifacts\release-packages\electron'
          $manifestPath = Join-Path $outputRoot 'package-manifest.json'
          if (-not (Test-Path -LiteralPath $manifestPath)) {
            throw "Missing package manifest: $manifestPath"
          }

          $manifest = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
          if ($manifest.consumer -ne 'electron') {
            throw "Unexpected package consumer: $($manifest.consumer)"
          }
          if ($manifest.payloadCommit -ne $env:DIAGNOSTIC_SOURCE_COMMIT) {
            throw "Payload commit mismatch: $($manifest.payloadCommit)"
          }

          $setups = @(Get-ChildItem -LiteralPath $outputRoot -Recurse -File | Where-Object { $_.Name -match 'Setup.*\.exe$' })
          $blockmaps = @(Get-ChildItem -LiteralPath $outputRoot -Recurse -File | Where-Object { $_.Name -match 'Setup.*\.exe\.blockmap$' })
          if ($setups.Count -ne 1) {
            throw "Expected one Setup executable, found $($setups.Count)"
          }
          if ($blockmaps.Count -ne 1) {
            throw "Expected one Setup blockmap, found $($blockmaps.Count)"
          }
          if ($setups[0].Length -lt 100MB) {
            throw "Setup executable is unexpectedly small: $($setups[0].Length) bytes"
          }

          $hash = (Get-FileHash -LiteralPath $setups[0].FullName -Algorithm SHA256).Hash
          Write-Host "Electron Setup: $($setups[0].Name)"
          Write-Host "Bytes: $($setups[0].Length)"
          Write-Host "SHA256: $hash"
          Write-Host "releaseEligible: $($manifest.releaseEligible)"
          "setup_name=$($setups[0].Name)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "setup_bytes=$($setups[0].Length)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "setup_sha256=$hash" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Upload verified Electron diagnostic package
        uses: actions/upload-artifact@v4
        with:
          name: release-benchmark-electron-formal-${{ github.sha }}
          path: |
            .artifacts/release-packages/electron/**/*Setup*.exe
            .artifacts/release-packages/electron/**/*Setup*.exe.blockmap
            .artifacts/release-packages/electron/package-manifest.json
          if-no-files-found: error
          retention-days: 2
          compression-level: 0

      - name: Publish diagnostic final status
        if: always()
        uses: actions/github-script@v7
        env:
          PACKAGE_OUTCOME: ${{ steps.package.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          SETUP_NAME: ${{ steps.verify.outputs.setup_name }}
        with:
          script: |
            const succeeded = process.env.PACKAGE_OUTCOME === 'success'
              && process.env.VERIFY_OUTCOME === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: succeeded ? 'success' : 'failure',
              context: 'release-factory-v2-electron-diagnostic',
              description: succeeded
                ? `Formal Electron package verified: ${process.env.SETUP_NAME}`
                : 'Formal Electron package verification failed',
              target_url: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
            });
