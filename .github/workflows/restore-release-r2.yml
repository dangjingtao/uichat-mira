name: Restore Release R2 Contract

on:
  push:
    branches:
      - diagnostic/release-r2-restore
    paths:
      - '.github/workflows/restore-release-r2.yml'

permissions:
  contents: write
  statuses: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout patch branch
        uses: actions/checkout@v4

      - name: Checkout Release Factory branch
        uses: actions/checkout@v4
        with:
          ref: feature/release-factory-v2
          path: target
          fetch-depth: 0

      - name: Publish running status
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              context: 'release-r2-restore',
              description: 'Restoring GitHub Release and R2 publishing',
              target_url: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
            });

      - name: Patch Release Factory workflow
        run: python scripts/diagnostics/patch-release-r2-workflow.py target/.github/workflows/release-factory-v2.yml

      - name: Validate workflow
        shell: bash
        run: |
          set -euo pipefail
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -no-color target/.github/workflows/release-factory-v2.yml
          grep -q 'Upload release assets to Cloudflare R2' target/.github/workflows/release-factory-v2.yml
          grep -q 'publish-release-assets' target/.github/workflows/release-factory-v2.yml

      - name: Commit R2 publishing contract
        shell: bash
        run: |
          set -euo pipefail
          cd target
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/release-factory-v2.yml
          git commit -m 'fix(release): restore GitHub and R2 publishing contract'
          git push origin HEAD:feature/release-factory-v2

      - name: Publish success status
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'success',
              context: 'release-r2-restore',
              description: 'GitHub Release and R2 publishing restored',
              target_url: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
            });
