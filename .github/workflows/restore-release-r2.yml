name: Export Release Factory Workflow

on:
  push:
    branches:
      - diagnostic/release-r2-restore
    paths:
      - '.github/workflows/restore-release-r2.yml'

permissions:
  contents: read
  statuses: write

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/release-factory-v2
          fetch-depth: 1

      - name: Publish running status
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              context: 'release-r2-export',
              description: 'Exporting current Release Factory workflow',
              target_url: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
            });

      - name: Stage workflow file
        run: |
          mkdir -p export
          cp .github/workflows/release-factory-v2.yml export/release-factory-v2.yml

      - name: Upload workflow source
        uses: actions/upload-artifact@v4
        with:
          name: release-factory-source-${{ github.sha }}
          path: export/release-factory-v2.yml
          if-no-files-found: error
          retention-days: 1

      - name: Publish success status
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'success',
              context: 'release-r2-export',
              description: 'Release Factory workflow exported',
              target_url: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
            });
