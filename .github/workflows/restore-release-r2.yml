name: Export Release Factory Git Metadata

on:
  push:
    branches:
      - diagnostic/release-r2-restore
    paths:
      - '.github/workflows/restore-release-r2.yml'

permissions:
  contents: read
  statuses: write

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/release-factory-v2
          fetch-depth: 1

      - name: Export commit and tree metadata
        shell: bash
        run: |
          mkdir -p export
          git rev-parse HEAD > export/commit-sha.txt
          git rev-parse 'HEAD^{tree}' > export/tree-sha.txt
          cp .github/workflows/release-factory-v2.yml export/release-factory-v2.yml
          cat export/commit-sha.txt
          cat export/tree-sha.txt

      - name: Upload Git metadata
        uses: actions/upload-artifact@v4
        with:
          name: release-factory-git-metadata-${{ github.sha }}
          path: export
          if-no-files-found: error
          retention-days: 1

      - name: Publish success status
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'success',
              context: 'release-r2-git-metadata',
              description: 'Release Factory Git metadata exported',
              target_url: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
            });
