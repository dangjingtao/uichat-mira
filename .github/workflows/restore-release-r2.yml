name: Validate Production Release Workflow

on:
  push:
    branches:
      - diagnostic/release-r2-restore
    paths:
      - '.github/workflows/restore-release-r2.yml'

permissions:
  contents: read
  statuses: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/release-factory-v2
          fetch-depth: 1

      - name: Publish running status
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              context: 'release-production-lint',
              description: 'Validating Factory and R2 release workflows',
              target_url: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
            });

      - name: Run actionlint
        shell: bash
        run: |
          set -euo pipefail
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -no-color \
            .github/workflows/release-factory-v2.yml \
            .github/workflows/release-production.yml

      - name: Verify R2 contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q "uses: ./.github/workflows/release-factory-v2.yml" .github/workflows/release-production.yml
          grep -q "latest_prefix=\"mira/latest\"" .github/workflows/release-production.yml
          grep -q "legacy_previous_prefix=\"mira/previous\"" .github/workflows/release-production.yml
          grep -q "aws s3 sync dist/" .github/workflows/release-production.yml
          grep -q -- "--delete" .github/workflows/release-production.yml

      - name: Publish success status
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'success',
              context: 'release-production-lint',
              description: 'Factory and R2 release workflows are valid',
              target_url: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
            });
