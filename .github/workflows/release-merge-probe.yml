name: Release Merge Probe

on:
  push:
    branches:
      - wip/release-factory-speed
    paths:
      - '.github/workflows/release-merge-probe.yml'

permissions:
  actions: read
  contents: write
  statuses: write

jobs:
  probe-client-merge:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wip/release-factory-speed
          fetch-depth: 0

      - uses: pnpm/action-setup@v3
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Publish merge probe status
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              context: 'release-merge-probe',
              description: 'Testing blob-only Vitest merge input',
              target_url: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
            });

      - name: Patch blob-only merge directory in workspace
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          path = Path('scripts/release/run-test-scope.mjs')
          text = path.read_text(encoding='utf-8')
          merge_start = text.index('async function mergeShards()')
          insert_at = text.index('  fs.rmSync(reportDir, { recursive: true, force: true });', merge_start)
          if 'const vitestMergeDir = path.join(validationRoot, "merge-input", scope);' not in text:
              block = '''  const blobFiles = fs
            .readdirSync(mergeDir)
            .filter((filename) => filename.endsWith(".blob.json"))
            .map((filename) => path.join(mergeDir, filename));
          if (expectedShards > 0 && blobFiles.length !== expectedShards) {
            throw new Error(
              `Expected ${expectedShards} ${scope} Vitest blobs, received ${blobFiles.length}.`,
            );
          }

          const vitestMergeDir = path.join(validationRoot, "merge-input", scope);
          fs.rmSync(vitestMergeDir, { recursive: true, force: true });
          fs.mkdirSync(vitestMergeDir, { recursive: true });
          for (const blobFile of blobFiles) {
            fs.copyFileSync(blobFile, path.join(vitestMergeDir, path.basename(blobFile)));
          }

          '''
              text = text[:insert_at] + block + text[insert_at:]
          merge_start = text.index('async function mergeShards()')
          old = '`--merge-reports=${mergeDir}`'
          if old in text[merge_start:]:
              text = text[:merge_start] + text[merge_start:].replace(old, '`--merge-reports=${vitestMergeDir}`', 1)
          path.write_text(text, encoding='utf-8')
          '@ | python -
          node --check scripts/release/run-test-scope.mjs

      - run: pnpm install --frozen-lockfile --prefer-offline --filter @ui-chat-mira/desktop...

      - name: Download prior client shard artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: final-client-shard-*-9640cc8b54c567eb9599dcb60dfea83507750cc0
          path: .artifacts/release-validation/windows-x64/shards/client
          merge-multiple: true
          github-token: ${{ github.token }}
          run-id: 30222148715

      - name: Merge existing client shards
        id: merge
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path 'merge-probe' | Out-Null
          node scripts/release/run-test-scope.mjs --scope=client --merge-dir=.artifacts/release-validation/windows-x64/shards/client --expected-shards=2 *> 'merge-probe\merge-output.txt'
          $testExitCode = $LASTEXITCODE
          $reportReady = (Test-Path -LiteralPath '.artifacts\release-validation\windows-x64\reports\client\test-report.json') -and (Test-Path -LiteralPath '.artifacts\release-validation\windows-x64\reports\client\coverage-report.json')
          @{
            testExitCode = $testExitCode
            reportReady = $reportReady
          } | ConvertTo-Json | Out-File -LiteralPath 'merge-probe\diagnostic.json' -Encoding utf8
          if ($reportReady) {
            Copy-Item -LiteralPath '.artifacts\release-validation\windows-x64\reports\client' -Destination 'merge-probe\client-report' -Recurse -Force
            "report_ready=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            exit 0
          }
          "report_ready=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          exit 1

      - name: Commit tested blob-only merge fix
        if: steps.merge.outputs.report_ready == 'true'
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/release/run-test-scope.mjs
          if (-not (git diff --cached --quiet)) {
            git commit -m 'fix(release): isolate Vitest blob inputs during merge'
            git push origin HEAD:wip/release-factory-speed
          }

      - name: Upload merge diagnostics and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-merge-probe-${{ github.sha }}
          path: merge-probe
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Publish merge result
        if: always()
        uses: actions/github-script@v7
        env:
          REPORT_READY: ${{ steps.merge.outputs.report_ready }}
        with:
          script: |
            const passed = process.env.REPORT_READY === 'true';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: passed ? 'success' : 'failure',
              context: 'release-merge-probe',
              description: passed ? 'Client shard merge produced fresh reports' : 'Client shard merge did not produce reports',
              target_url: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
            });
            if (!passed) core.setFailed('Client shard merge did not produce reports');
