name: Repair v0.99.8 Release Payload Path

on:
  push:
    branches:
      - release/v0.99.8
    paths:
      - '.github/workflows/repair-v0.99.8-release-path.yml'

permissions:
  contents: write
  actions: write

jobs:
  repair-release-path:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release/v0.99.8
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.12.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Patch release factory to stable ASCII workspace
        shell: pwsh
        run: |
          $path = '.github/workflows/release-factory-v2.yml'
          $text = [System.IO.File]::ReadAllText($path)

          $oldRoot = 'D:\\Mira 构建验证\\含 空格 & 符号\\workspace'
          $newRoot = 'D:\\mira-release\\workspace'
          $rootCount = ([regex]::Matches($text, [regex]::Escape($oldRoot))).Count
          if ($rootCount -lt 2) {
            throw "Expected at least 2 hostile workspace references, found $rootCount"
          }
          $text = $text.Replace($oldRoot, $newRoot)

          $oldModels = 'D:\\Mira 构建验证\\binary-cache\\local-models'
          $newModels = 'D:\\mira-release\\binary-cache\\local-models'
          $modelCount = ([regex]::Matches($text, [regex]::Escape($oldModels))).Count
          if ($modelCount -lt 1) {
            throw "Expected at least 1 hostile model-cache reference, found $modelCount"
          }
          $text = $text.Replace($oldModels, $newModels)

          [System.IO.File]::WriteAllText($path, $text, [System.Text.UTF8Encoding]::new($false))
          Write-Host "Replaced $rootCount workspace path reference(s) and $modelCount model path reference(s)."
          git diff -- $path

      - name: Stage source into repaired release path
        shell: pwsh
        run: |
          $target = 'D:\mira-release\workspace'
          $parent = Split-Path -Parent $target
          if (Test-Path -LiteralPath $parent) {
            Remove-Item -LiteralPath $parent -Recurse -Force
          }
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          $archive = Join-Path $env:RUNNER_TEMP 'mira-v0.99.8-ascii-path.zip'
          git archive --format=zip --output=$archive HEAD
          Expand-Archive -LiteralPath $archive -DestinationPath $target -Force
          "MIRA_TEST_ROOT=$target" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install dependencies in repaired path
        shell: pwsh
        run: pnpm --dir "$env:MIRA_TEST_ROOT" install --frozen-lockfile --prefer-offline

      - name: Verify full server build in repaired path
        shell: pwsh
        run: pnpm --dir "$env:MIRA_TEST_ROOT" --filter @ui-chat-mira/server build

      - name: Commit release factory repair and remove diagnostics
        shell: pwsh
        run: |
          Remove-Item -LiteralPath '.github/workflows/repair-v0.99.8-release-path.yml' -Force
          if (Test-Path -LiteralPath '.github/workflows/diagnose-v0.99.8-server-path.yml') {
            Remove-Item -LiteralPath '.github/workflows/diagnose-v0.99.8-server-path.yml' -Force
          }
          if (Test-Path -LiteralPath '.github/workflows/hotfix-v0.99.8-esbuild.yml') {
            Remove-Item -LiteralPath '.github/workflows/hotfix-v0.99.8-esbuild.yml' -Force
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(release): use stable ASCII workspace for Windows payload"
          git push origin HEAD:release/v0.99.8

      - name: Move unpublished v0.99.8 tag to repaired commit
        shell: pwsh
        run: |
          $sha = git rev-parse HEAD
          git tag -f v0.99.8 $sha
          git push origin refs/tags/v0.99.8 --force

      - name: Trigger production release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release-production.yml --ref v0.99.8
