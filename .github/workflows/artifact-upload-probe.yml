name: Artifact Upload Probe

on:
  push:
    branches:
      - wip/release-factory-speed
    paths:
      - '.github/workflows/artifact-upload-probe.yml'

permissions:
  contents: write
  statuses: write

jobs:
  probe:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wip/release-factory-speed
          fetch-depth: 0

      - uses: pnpm/action-setup@v3
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Publish probe status
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              context: 'artifact-upload-probe',
              description: 'Testing Windows shard launcher',
              target_url: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
            });

      - name: Patch Windows pnpm launcher in workspace
        shell: pwsh
        run: |
          $path = 'scripts\release\run-test-scope.mjs'
          $text = Get-Content -LiteralPath $path -Raw
          $old = @'
          const pnpmExecutable = process.platform === "win32" ? "pnpm.cmd" : "pnpm";
          '@.Trim()
          $new = @'
          const pnpmExecutable =
            process.platform === "win32"
              ? process.env.ComSpec || process.env.COMSPEC || "cmd.exe"
              : "pnpm";
          '@.Trim()
          if (-not $text.Contains($old)) {
            throw 'Expected pnpm executable declaration was not found.'
          }
          $text = $text.Replace($old, $new)

          $oldSpawn = @'
              const child = spawn(pnpmExecutable, commandArgs, {
          '@.Trim()
          $newSpawn = @'
              const pnpmArguments =
                process.platform === "win32"
                  ? ["/d", "/s", "/c", "pnpm.cmd", ...commandArgs]
                  : commandArgs;
              const child = spawn(pnpmExecutable, pnpmArguments, {
          '@.Trim()
          if (-not $text.Contains($oldSpawn)) {
            throw 'Expected pnpm spawn declaration was not found.'
          }
          $text = $text.Replace($oldSpawn, $newSpawn)
          [System.IO.File]::WriteAllText((Resolve-Path $path), $text, [System.Text.UTF8Encoding]::new($false))
          node --check $path

      - name: Install client test dependencies
        run: pnpm install --frozen-lockfile --prefer-offline --filter @ui-chat-mira/desktop...

      - name: Run one real client shard
        id: shard
        continue-on-error: true
        run: node scripts/release/run-test-scope.mjs --scope=client --shard=1/2 --timeout-seconds=480

      - name: Inspect and package real shard
        id: package
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          $source = '.artifacts\release-validation\windows-x64\shards\client\1-of-2'
          if (-not (Test-Path -LiteralPath $source)) {
            throw "Missing real shard directory: $source"
          }

          $files = Get-ChildItem -LiteralPath $source -File -Recurse
          $diagnostic = @{
            shardOutcome = '${{ steps.shard.outcome }}'
            fileCount = $files.Count
            totalBytes = ($files | Measure-Object -Property Length -Sum).Sum
            files = @($files | ForEach-Object {
              @{
                name = $_.Name
                relativePath = [System.IO.Path]::GetRelativePath((Resolve-Path $source), $_.FullName)
                bytes = $_.Length
              }
            })
          }

          New-Item -ItemType Directory -Force -Path 'artifact-probe' | Out-Null
          $diagnostic | ConvertTo-Json -Depth 5 | Out-File -LiteralPath 'artifact-probe\diagnostic.json' -Encoding utf8
          Compress-Archive -Path "$source\*" -DestinationPath 'artifact-probe\client-shard.zip' -CompressionLevel Fastest -Force
          Copy-Item -LiteralPath $source -Destination 'artifact-probe\raw-shard' -Recurse -Force
          Get-Content -LiteralPath 'artifact-probe\diagnostic.json'

      - name: Commit tested launcher fix
        if: steps.package.outcome == 'success'
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/release/run-test-scope.mjs
          if (-not (git diff --cached --quiet)) {
            git commit -m 'fix(release): launch pnpm through cmd on Windows'
            git push origin HEAD:wip/release-factory-speed
          }

      - name: Upload diagnostic only
        id: diagnostic-upload
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: shard-diagnostic-${{ github.sha }}
          path: artifact-probe/diagnostic.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Upload zipped shard
        id: zip-upload
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: shard-zip-${{ github.sha }}
          path: artifact-probe/client-shard.zip
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Upload raw shard
        id: raw-upload
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: shard-raw-${{ github.sha }}
          path: artifact-probe/raw-shard
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Publish probe result
        if: always()
        uses: actions/github-script@v7
        env:
          PACKAGE_OUTCOME: ${{ steps.package.outcome }}
          DIAGNOSTIC_UPLOAD: ${{ steps.diagnostic-upload.outcome }}
          ZIP_UPLOAD: ${{ steps.zip-upload.outcome }}
          RAW_UPLOAD: ${{ steps.raw-upload.outcome }}
          SHARD_OUTCOME: ${{ steps.shard.outcome }}
        with:
          script: |
            const summary = `shard=${process.env.SHARD_OUTCOME}, package=${process.env.PACKAGE_OUTCOME}, diagnostic=${process.env.DIAGNOSTIC_UPLOAD}, zip=${process.env.ZIP_UPLOAD}, raw=${process.env.RAW_UPLOAD}`;
            const passed = process.env.PACKAGE_OUTCOME === 'success' && process.env.DIAGNOSTIC_UPLOAD === 'success' && process.env.ZIP_UPLOAD === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: passed ? 'success' : 'failure',
              context: 'artifact-upload-probe',
              description: summary.slice(0, 140),
              target_url: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
            });
            if (!passed) core.setFailed(summary);
