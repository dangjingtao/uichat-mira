name: Artifact Upload Probe

on:
  push:
    branches:
      - wip/release-factory-speed
    paths:
      - '.github/workflows/artifact-upload-probe.yml'

permissions:
  contents: read
  statuses: write

jobs:
  probe:
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - name: Publish probe status
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              context: 'artifact-upload-probe',
              description: 'Windows artifact upload probe is running',
              target_url: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
            });

      - name: Create tiny probe directory
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path 'release-validation-shards\client\1-of-2' | Out-Null
          'mira-artifact-probe' | Out-File -LiteralPath 'release-validation-shards\client\1-of-2\status.json' -Encoding utf8
          'blob-probe' | Out-File -LiteralPath 'release-validation-shards\client\1-of-2\vitest-client-1-of-2.blob.json' -Encoding utf8
          Get-ChildItem -LiteralPath 'release-validation-shards' -Recurse | Format-Table FullName, Length

      - name: Upload tiny Windows probe
        uses: actions/upload-artifact@v4
        with:
          name: mira-windows-artifact-probe-${{ github.sha }}
          path: release-validation-shards/client/1-of-2
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Publish probe success
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'success',
              context: 'artifact-upload-probe',
              description: 'Windows artifact upload probe passed',
              target_url: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
            });
