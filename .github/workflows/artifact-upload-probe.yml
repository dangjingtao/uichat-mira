name: Artifact Upload Probe

on:
  push:
    branches:
      - wip/release-factory-speed
    paths:
      - '.github/workflows/artifact-upload-probe.yml'

permissions:
  contents: read
  statuses: write

jobs:
  probe:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Publish probe status
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              context: 'artifact-upload-probe',
              description: 'Real shard artifact probe is running',
              target_url: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
            });

      - name: Install client test dependencies
        run: pnpm install --frozen-lockfile --prefer-offline --filter @ui-chat-mira/desktop...

      - name: Run one real client shard
        id: shard
        continue-on-error: true
        run: node scripts/release/run-test-scope.mjs --scope=client --shard=1/2 --timeout-seconds=480

      - name: Inspect and package real shard
        id: package
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          $source = '.artifacts\release-validation\windows-x64\shards\client\1-of-2'
          if (-not (Test-Path -LiteralPath $source)) {
            throw "Missing real shard directory: $source"
          }

          $files = Get-ChildItem -LiteralPath $source -File -Recurse
          $diagnostic = @{
            shardOutcome = '${{ steps.shard.outcome }}'
            fileCount = $files.Count
            totalBytes = ($files | Measure-Object -Property Length -Sum).Sum
            files = @($files | ForEach-Object {
              @{
                name = $_.Name
                relativePath = [System.IO.Path]::GetRelativePath((Resolve-Path $source), $_.FullName)
                bytes = $_.Length
              }
            })
          }

          New-Item -ItemType Directory -Force -Path 'artifact-probe' | Out-Null
          $diagnostic | ConvertTo-Json -Depth 5 | Out-File -LiteralPath 'artifact-probe\diagnostic.json' -Encoding utf8
          Compress-Archive -Path "$source\*" -DestinationPath 'artifact-probe\client-shard.zip' -CompressionLevel Fastest -Force
          Copy-Item -LiteralPath $source -Destination 'artifact-probe\raw-shard' -Recurse -Force
          Get-Content -LiteralPath 'artifact-probe\diagnostic.json'

      - name: Upload diagnostic only
        id: diagnostic-upload
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: shard-diagnostic-${{ github.sha }}
          path: artifact-probe/diagnostic.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Upload zipped shard
        id: zip-upload
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: shard-zip-${{ github.sha }}
          path: artifact-probe/client-shard.zip
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Upload raw shard
        id: raw-upload
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: shard-raw-${{ github.sha }}
          path: artifact-probe/raw-shard
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Publish probe result
        if: always()
        uses: actions/github-script@v7
        env:
          PACKAGE_OUTCOME: ${{ steps.package.outcome }}
          DIAGNOSTIC_UPLOAD: ${{ steps.diagnostic-upload.outcome }}
          ZIP_UPLOAD: ${{ steps.zip-upload.outcome }}
          RAW_UPLOAD: ${{ steps.raw-upload.outcome }}
          SHARD_OUTCOME: ${{ steps.shard.outcome }}
        with:
          script: |
            const summary = `shard=${process.env.SHARD_OUTCOME}, package=${process.env.PACKAGE_OUTCOME}, diagnostic=${process.env.DIAGNOSTIC_UPLOAD}, zip=${process.env.ZIP_UPLOAD}, raw=${process.env.RAW_UPLOAD}`;
            const transportPassed = process.env.DIAGNOSTIC_UPLOAD === 'success' && process.env.ZIP_UPLOAD === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: transportPassed ? 'success' : 'failure',
              context: 'artifact-upload-probe',
              description: summary.slice(0, 140),
              target_url: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
            });
            if (!transportPassed) core.setFailed(summary);
