name: Artifact Upload Probe

on:
  push:
    branches:
      - wip/release-factory-speed
    paths:
      - '.github/workflows/artifact-upload-probe.yml'

permissions:
  contents: read
  statuses: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Publish probe status
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              context: 'artifact-upload-probe',
              description: 'Artifact upload probe is running',
              target_url: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
            });

      - name: Create tiny probe
        run: printf 'mira-artifact-probe\n' > probe.txt

      - name: Upload tiny probe
        uses: actions/upload-artifact@v4
        with:
          name: mira-artifact-probe-${{ github.sha }}
          path: probe.txt
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Publish probe success
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'success',
              context: 'artifact-upload-probe',
              description: 'Artifact upload probe passed',
              target_url: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
            });
