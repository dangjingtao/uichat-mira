name: Patch Release Advisory Test Policy

on:
  push:
    branches:
      - dev
    paths:
      - '.github/workflows/patch-release-advisory-tests.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Make tests and coverage advisory
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path_str, old, new):
              path = Path(path_str)
              text = path.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Expected block not found in {path}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          validation = 'scripts/release/validation-utils.mjs'
          replace_exact(
              validation,
              '''export function isValidationReleaseEligible(validation) {
            return (
              validation?.environment?.status === "passed" &&
              validation?.typecheck?.status === "passed" &&
              validation?.tests?.client?.status === "passed" &&
              validation?.tests?.server?.status === "passed"
            );
          }''',
              '''export function isValidationReleaseEligible(validation) {
            return (
              validation?.environment?.status === "passed" &&
              validation?.typecheck?.status === "passed"
            );
          }''',
          )
          replace_exact(
              validation,
              '''  for (const scope of ["client", "server"]) {
            const status = manifest.validation?.tests?.[scope]?.status;
            if (status === "passed") {
              continue;
            }
            if (status === "skipped" && allowSkippedTests) {
              continue;
            }
            if (status === "failed" && allowFailedTests) {
              continue;
            }
            throw new Error(
              `Release validation requires passed ${scope} tests; received ${status ?? "missing"}.`,
            );
          }''',
              '''  for (const scope of ["client", "server"]) {
            const status = manifest.validation?.tests?.[scope]?.status ?? "missing";
            if (status !== "passed") {
              console.warn(
                `Release ${scope} tests are advisory; continuing with status=${status}.`,
              );
            }
          }''',
          )
          replace_exact(
              validation,
              '''    releaseEligible: isValidationReleaseEligible(validation),
            validation,''',
              '''    releaseEligible: isValidationReleaseEligible(validation),
            testPolicy: "advisory",
            validation,''',
          )

          payload = 'scripts/release/payload-utils.mjs'
          replace_exact(
              payload,
              '''function isReleaseEligibleValidation(validation) {
            return (
              validation?.environment?.status === "passed" &&
              validation?.typecheck?.status === "passed" &&
              validation?.tests?.client?.status === "passed" &&
              validation?.tests?.server?.status === "passed"
            );
          }''',
              '''function isReleaseEligibleValidation(validation) {
            return (
              validation?.environment?.status === "passed" &&
              validation?.typecheck?.status === "passed"
            );
          }''',
          )
          replace_exact(
              payload,
              '''  for (const scope of ["client", "server"]) {
            const result = validation?.tests?.[scope];
            if (!result) {
              throw new Error(`Payload validation is missing ${scope} test results.`);
            }
            if (result.status === "passed") {
              continue;
            }
            if (result.status === "skipped" && allowSkippedTests) {
              continue;
            }
            if (result.status === "failed" && allowFailedTests) {
              continue;
            }
            throw new Error(
              `Payload validation requires passed ${scope} tests; received ${result.status ?? "missing"}.`,
            );
          }''',
              '''  for (const scope of ["client", "server"]) {
            const status = validation?.tests?.[scope]?.status ?? "missing";
            if (status !== "passed") {
              console.warn(
                `Payload ${scope} tests are advisory; continuing with status=${status}.`,
              );
            }
          }''',
          )
          replace_exact(
              payload,
              '''    releaseEligible: isReleaseEligibleValidation(validation),
            validation,''',
              '''    releaseEligible: isReleaseEligibleValidation(validation),
            testPolicy: "advisory",
            validation,''',
          )
          PY

          node --check scripts/release/validation-utils.mjs
          node --check scripts/release/payload-utils.mjs
          git diff --check

      - name: Commit policy correction and remove patch workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/patch-release-advisory-tests.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/release/validation-utils.mjs scripts/release/payload-utils.mjs .github/workflows/patch-release-advisory-tests.yml
          git commit -m "fix(release): make test results advisory for packaging"
          git push origin HEAD:dev
