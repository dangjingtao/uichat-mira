name: Agent Runtime CI

on:
  pull_request:
    branches:
      - dev
    paths:
      - "server/src/agent/**"
      - "server/src/skills/agent/**"
      - "server/package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/agent-runtime-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-runtime-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  server-agent:
    name: Server Agent
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: file:/tmp/uichat-mira-agent-ci.db

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install server workspace dependencies
        run: pnpm install --frozen-lockfile --filter @ui-chat-mira/server...

      - name: Typecheck server
        run: pnpm --filter @ui-chat-mira/server typecheck

      - name: Run delegated-task contract regressions
        run: >-
          pnpm --filter @ui-chat-mira/server test --
          src/agent/__tests__/generic-task-subagent.test.ts
          src/agent/__tests__/generic-task-resume.test.ts
          src/agent/__tests__/routes.test.ts
          src/agent/__tests__/nodes.test.ts
          src/agent/__tests__/approval-resume-scheduling.test.ts
          src/agent/__tests__/runtime-checkpoint.test.ts
          src/agent/__tests__/policy.test.ts
          src/agent/__tests__/planner-direct-tool-action.test.ts
          src/agent/__tests__/tool-call-normalize.test.ts
          src/agent/__tests__/pi-agent-loop-runtime.test.ts
          src/agent/__tests__/pi-loop-semantic-compat.test.ts
          src/agent/__tests__/toolcall-loop-regression.test.ts
          --maxWorkers=1
          --fileParallelism=false

      - name: Audit full Agent suite
        id: agent-audit
        continue-on-error: true
        run: >-
          pnpm --filter @ui-chat-mira/server test --
          src/agent/__tests__
          --maxWorkers=1
          --fileParallelism=false
          --reporter=json
          --outputFile=agent-test-report.json

      - name: Upload full Agent audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-test-report
          path: server/agent-test-report.json
          if-no-files-found: error
          retention-days: 7
