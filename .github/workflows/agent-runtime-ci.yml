name: Agent Runtime CI

on:
  pull_request:
    branches:
      - dev
    paths:
      - "server/src/agent/**"
      - "server/src/skills/agent/**"
      - "server/package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/agent-runtime-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-runtime-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  server-agent:
    name: Server Agent
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install server workspace dependencies
        run: pnpm install --frozen-lockfile --filter @ui-chat-mira/server...

      - name: Typecheck server
        run: pnpm --filter @ui-chat-mira/server typecheck

      - name: Run full Agent regression suite
        id: agent-tests
        continue-on-error: true
        run: >-
          pnpm --filter @ui-chat-mira/server test --
          src/agent/__tests__
          --reporter=json
          --outputFile=agent-test-report.json

      - name: Upload Agent regression report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-test-report
          path: server/agent-test-report.json
          if-no-files-found: error
          retention-days: 7

      - name: Enforce Agent regression result
        if: steps.agent-tests.outcome == 'failure'
        run: exit 1
