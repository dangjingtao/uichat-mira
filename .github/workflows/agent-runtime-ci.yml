name: Agent Runtime CI

on:
  pull_request:
    branches:
      - dev
    paths:
      - "server/src/agent/**"
      - "server/src/skills/agent/**"
      - "server/package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/agent-runtime-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-runtime-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  server-agent:
    name: Server Agent
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: file:/tmp/uichat-mira-agent-ci.db

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install server workspace dependencies
        run: pnpm install --frozen-lockfile --filter @ui-chat-mira/server...

      - name: Typecheck server
        run: pnpm --filter @ui-chat-mira/server typecheck

      - name: Run delegated-task contract regressions
        id: delegated-task-tests
        continue-on-error: true
        run: >-
          pnpm --filter @ui-chat-mira/server test --
          src/agent/__tests__/generic-task-subagent.test.ts
          src/agent/__tests__/generic-task-resume.test.ts
          src/agent/__tests__/routes.test.ts
          src/agent/__tests__/nodes.test.ts
          src/agent/__tests__/approval-resume-scheduling.test.ts
          src/agent/__tests__/runtime-checkpoint.test.ts
          src/agent/__tests__/policy.test.ts
          src/agent/__tests__/planner-direct-tool-action.test.ts
          src/agent/__tests__/tool-call-normalize.test.ts
          src/agent/__tests__/pi-agent-loop-runtime.test.ts
          src/agent/__tests__/pi-loop-semantic-compat.test.ts
          src/agent/__tests__/toolcall-loop-regression.test.ts
          --maxWorkers=1
          --fileParallelism=false
          --reporter=json
          --outputFile=delegated-task-test-report.json

      - name: Upload delegated-task regression report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: delegated-task-test-report
          path: server/delegated-task-test-report.json
          if-no-files-found: error
          retention-days: 7

      - name: Run dev baseline for recoverable tool loop
        id: dev-baseline
        if: always()
        continue-on-error: true
        env:
          DATABASE_URL: file:/tmp/uichat-mira-agent-dev-baseline.db
        run: |
          git fetch origin dev --depth=1
          git worktree add /tmp/uichat-mira-dev-baseline origin/dev
          cd /tmp/uichat-mira-dev-baseline
          pnpm install --frozen-lockfile --filter @ui-chat-mira/server...
          pnpm --filter @ui-chat-mira/server test -- \
            src/agent/__tests__/toolcall-loop-regression.test.ts \
            --maxWorkers=1 \
            --fileParallelism=false \
            --reporter=json \
            --outputFile=dev-toolcall-loop-report.json

      - name: Upload dev baseline report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dev-toolcall-loop-report
          path: /tmp/uichat-mira-dev-baseline/server/dev-toolcall-loop-report.json
          if-no-files-found: error
          retention-days: 7

      - name: Audit full Agent suite
        id: agent-audit
        if: always()
        continue-on-error: true
        run: >-
          pnpm --filter @ui-chat-mira/server test --
          src/agent/__tests__
          --maxWorkers=1
          --fileParallelism=false
          --reporter=json
          --outputFile=agent-test-report.json

      - name: Upload full Agent audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-test-report
          path: server/agent-test-report.json
          if-no-files-found: error
          retention-days: 7

      - name: Enforce delegated-task regressions
        if: steps.delegated-task-tests.outcome == 'failure' && steps.dev-baseline.outcome != 'failure'
        run: exit 1
