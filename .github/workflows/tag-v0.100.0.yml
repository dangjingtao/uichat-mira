name: Create v0.100.0 Tag

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/tag-v0.100.0.yml'

permissions:
  actions: write
  contents: write

jobs:
  create-tag:
    name: Create v0.100.0 from dev
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create and push tag
        env:
          RELEASE_TAG: v0.100.0
          TARGET_SHA: d79fb89e57a717dec57b7986c444aa63d906bb41
        shell: bash
        run: |
          if git rev-parse -q --verify "refs/tags/${RELEASE_TAG}" >/dev/null; then
            existing_sha=$(git rev-list -n 1 "${RELEASE_TAG}")
            if [ "${existing_sha}" != "${TARGET_SHA}" ]; then
              echo "Tag ${RELEASE_TAG} already exists at ${existing_sha}, expected ${TARGET_SHA}." >&2
              exit 1
            fi
            echo "Tag ${RELEASE_TAG} already points to ${TARGET_SHA}."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "${RELEASE_TAG}" "${TARGET_SHA}"
          git push origin "refs/tags/${RELEASE_TAG}"

      - name: Trigger desktop release workflow
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v0.100.0
        shell: bash
        run: gh workflow run build-desktop.yml --ref "${RELEASE_TAG}"
