name: Create v0.99.8 Tag

on:
  push:
    branches:
      - release/v0.99.8
    paths:
      - '.github/workflows/tag-v0.99.8.yml'

permissions:
  actions: write
  contents: write

jobs:
  create-tag:
    name: Create v0.99.8 from release branch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create and push tag
        env:
          RELEASE_TAG: v0.99.8
          TARGET_SHA: ${{ github.sha }}
        shell: bash
        run: |
          if git rev-parse -q --verify "refs/tags/${RELEASE_TAG}" >/dev/null; then
            existing_sha=$(git rev-list -n 1 "${RELEASE_TAG}")
            if [ "${existing_sha}" != "${TARGET_SHA}" ]; then
              echo "Tag ${RELEASE_TAG} already exists at ${existing_sha}, expected ${TARGET_SHA}." >&2
              exit 1
            fi
            echo "Tag ${RELEASE_TAG} already points to ${TARGET_SHA}."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag "${RELEASE_TAG}" "${TARGET_SHA}"
            git push origin "refs/tags/${RELEASE_TAG}"
          fi

      - name: Trigger production release workflow
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v0.99.8
        shell: bash
        run: gh workflow run release-production.yml --ref "${RELEASE_TAG}"
