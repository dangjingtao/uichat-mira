name: Repair v0.99.8 Server Build

on:
  push:
    branches:
      - release/v0.99.8
    paths:
      - '.github/workflows/hotfix-v0.99.8-esbuild.yml'

permissions:
  contents: write
  actions: write

jobs:
  repair-server-build:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release/v0.99.8
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.12.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Pin server esbuild to known-good workspace version
        shell: pwsh
        run: |
          @'
          const fs = require('fs');
          const packagePath = 'server/package.json';
          const pkg = JSON.parse(fs.readFileSync(packagePath, 'utf8'));
          if (pkg.devDependencies?.esbuild !== '^0.28.0') {
            throw new Error(`Unexpected server esbuild version: ${pkg.devDependencies?.esbuild}`);
          }
          pkg.devDependencies.esbuild = '^0.21.5';
          fs.writeFileSync(packagePath, JSON.stringify(pkg, null, 2) + '\n');
          '@ | node
          git diff -- server/package.json

      - name: Regenerate lockfile and install dependencies
        run: pnpm install --no-frozen-lockfile --prefer-offline

      - name: Verify patched lockfile is frozen-installable
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Stage patched source into hostile Windows path
        shell: pwsh
        run: |
          $target = 'D:\Mira 构建验证\含 空格 & 符号\workspace'
          $parent = Split-Path -Parent $target
          if (Test-Path -LiteralPath $parent) {
            Remove-Item -LiteralPath $parent -Recurse -Force
          }
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          $archive = Join-Path $env:RUNNER_TEMP 'mira-v0.99.8-server-build.zip'
          git archive --format=zip --output=$archive HEAD
          Expand-Archive -LiteralPath $archive -DestinationPath $target -Force
          Copy-Item -LiteralPath 'server/package.json' -Destination (Join-Path $target 'server/package.json') -Force
          Copy-Item -LiteralPath 'pnpm-lock.yaml' -Destination (Join-Path $target 'pnpm-lock.yaml') -Force
          "MIRA_TEST_ROOT=$target" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install hostile-path dependencies
        shell: pwsh
        run: pnpm --dir "$env:MIRA_TEST_ROOT" install --frozen-lockfile --prefer-offline

      - name: Verify server build in hostile Windows path
        shell: pwsh
        run: pnpm --dir "$env:MIRA_TEST_ROOT" --filter @ui-chat-mira/server build

      - name: Commit repair and remove one-shot workflow
        shell: pwsh
        run: |
          Remove-Item -LiteralPath '.github/workflows/hotfix-v0.99.8-esbuild.yml' -Force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/package.json pnpm-lock.yaml .github/workflows/hotfix-v0.99.8-esbuild.yml
          git commit -m "fix(build): pin server esbuild for Windows release"
          git push origin HEAD:release/v0.99.8

      - name: Move failed unpublished tag to repaired commit
        shell: pwsh
        run: |
          $sha = git rev-parse HEAD
          git tag -f v0.99.8 $sha
          git push origin refs/tags/v0.99.8 --force

      - name: Trigger production release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release-production.yml --ref v0.99.8
