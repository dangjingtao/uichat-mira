name: Retag v0.99.6

on:
  push:
    branches:
      - dev
    paths:
      - '.github/workflows/retag-v0.99.6.yml'

permissions:
  contents: write

jobs:
  retag:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: v0.99.6
      TARGET_SHA: a3f9a5ca3ee7809159e69e8f843f4a94a58ec452
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Validate and move tag
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin dev --tags --force
          git merge-base --is-ancestor "$TARGET_SHA" origin/dev
          version=$(git show "${TARGET_SHA}:package.json" | node -e "let s='';process.stdin.on('data',d=>s+=d);process.stdin.on('end',()=>process.stdout.write(JSON.parse(s).version))")
          test "$version" = "0.99.6"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "$RELEASE_TAG" "$TARGET_SHA"
          git push origin "+refs/tags/${RELEASE_TAG}"

      - name: Remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/retag-v0.99.6.yml
          git add .github/workflows/retag-v0.99.6.yml
          git commit -m "chore(release): remove v0.99.6 retag workflow"
          git push origin HEAD:dev
