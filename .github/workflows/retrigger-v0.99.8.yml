name: Retrigger repaired v0.99.8

on:
  push:
    branches:
      - ops/retrigger-v0.99.8-20260815
    paths:
      - '.github/workflows/retrigger-v0.99.8.yml'

permissions:
  contents: write
  actions: write

jobs:
  retrigger:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repaired release branch
        uses: actions/checkout@v4
        with:
          ref: release/v0.99.8
          fetch-depth: 0

      - name: Verify repaired commit and version
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "6f3c1cd414e06a898819148a8b524fe92f94f1ab"
          test "$(node -p "require('./package.json').version")" = "0.99.8"
          grep -Fq "D:\\mira-release\\workspace" .github/workflows/release-factory-v2.yml
          grep -Fq "include-hidden-files: true" .github/workflows/release-factory-v2.yml

      - name: Move unpublished tag to repaired commit
        shell: bash
        run: |
          set -euo pipefail
          git tag -f v0.99.8 HEAD
          git push origin refs/tags/v0.99.8 --force

      - name: Trigger formal production release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release-production.yml --ref v0.99.8
