name: Release Factory V2 Full Benchmark

on:
  push:
    branches:
      - feature/release-factory-v2
    paths:
      - '.github/workflows/release-factory-v2-full-benchmark.yml'
  workflow_dispatch: {}

permissions:
  actions: read
  contents: read
  statuses: write

concurrency:
  group: release-factory-v2-full-benchmark-${{ github.sha }}
  cancel-in-progress: false

jobs:
  wait-for-validation:
    name: Wait for fresh validation evidence
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      validation_run_id: ${{ steps.locate.outputs.validation_run_id }}
      validation_artifact_name: ${{ steps.locate.outputs.validation_artifact_name }}
      wait_seconds: ${{ steps.locate.outputs.wait_seconds }}
      benchmark_started_epoch: ${{ steps.locate.outputs.benchmark_started_epoch }}
    steps:
      - name: Wait for the V2 validation artifact from this commit
        id: locate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          started_epoch=$(date +%s)
          artifact_name="release-validation-windows-x64-${GITHUB_SHA}"
          echo "benchmark_started_epoch=${started_epoch}" >> "$GITHUB_OUTPUT"
          echo "Waiting for ${artifact_name}..."

          for attempt in $(seq 1 120); do
            response=$(gh api \
              -H 'Accept: application/vnd.github+json' \
              "/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${artifact_name}&per_page=100")
            run_id=$(jq -r ".artifacts | map(select(.expired == false and .workflow_run.head_sha == \"${GITHUB_SHA}\")) | first | .workflow_run.id // empty" <<<"$response")
            if [[ -n "$run_id" ]]; then
              finished_epoch=$(date +%s)
              echo "validation_run_id=$run_id" >> "$GITHUB_OUTPUT"
              echo "validation_artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"
              echo "wait_seconds=$((finished_epoch - started_epoch))" >> "$GITHUB_OUTPUT"
              echo "Found validation artifact in run ${run_id}."
              exit 0
            fi
            sleep 10
          done

          finished_epoch=$(date +%s)
          echo "wait_seconds=$((finished_epoch - started_epoch))" >> "$GITHUB_OUTPUT"
          echo "Timed out waiting for ${artifact_name}." >&2
          exit 1

  build-windows-payload:
    name: Build diagnostic payload from fresh validation
    needs: wait-for-validation
    runs-on: windows-2022
    timeout-minutes: 65
    outputs:
      validation_release_eligible: ${{ steps.validation.outputs.release_eligible }}
      payload_seconds: ${{ steps.payload.outputs.payload_seconds }}
    env:
      MIRA_BENCHMARK_ROOT: 'D:\rfv2\workspace'
      LOCAL_MODEL_RAW_ROOT: 'D:\rfv2-cache\local-models'
      LOCAL_MODEL_ALLOW_NETWORK: '1'
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: pnpm/action-setup@v3
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Stage repository into stable Windows benchmark path
        shell: pwsh
        run: |
          $benchmarkParent = Split-Path -Parent $env:MIRA_BENCHMARK_ROOT
          if (Test-Path -LiteralPath $benchmarkParent) {
            Remove-Item -LiteralPath $benchmarkParent -Recurse -Force
          }
          New-Item -ItemType Directory -Force -Path $env:MIRA_BENCHMARK_ROOT | Out-Null
          $sourceArchive = Join-Path $env:RUNNER_TEMP 'mira-release-benchmark-source.zip'
          git archive --format=zip --output=$sourceArchive HEAD
          Expand-Archive -LiteralPath $sourceArchive -DestinationPath $env:MIRA_BENCHMARK_ROOT -Force

      - name: Cache Terminal Runtime
        uses: actions/cache@v4
        with:
          path: 'D:\rfv2\workspace\.local-runtimes\terminal-dev'
          key: windows-release-factory-terminal-${{ hashFiles('scripts/terminal-runtime.lock.json') }}

      - name: Cache Piper Runtime
        uses: actions/cache@v4
        with:
          path: 'D:\rfv2\workspace\.local-runtimes\piper'
          key: windows-release-factory-piper-${{ hashFiles('scripts/prepare-piper-runtime.mjs') }}

      - name: Cache Vivliostyle Runtime
        uses: actions/cache@v4
        with:
          path: 'D:\rfv2\workspace\.local-runtimes\vivliostyle'
          key: windows-release-factory-vivliostyle-${{ hashFiles('scripts/prepare-vivliostyle-runtime.mjs') }}

      - name: Cache local model sources
        uses: actions/cache@v4
        with:
          path: 'D:\rfv2-cache\local-models'
          key: windows-release-factory-models-${{ hashFiles('scripts/prepare-local-model-packs.mjs') }}
          restore-keys: |
            windows-release-factory-models-

      - name: Install build dependencies
        shell: pwsh
        run: |
          pnpm --dir "$env:MIRA_BENCHMARK_ROOT" install --frozen-lockfile --prefer-offline
          npm ci --prefix "$env:MIRA_BENCHMARK_ROOT\mira-clipper-ext" --ignore-scripts --prefer-offline

      - name: Download fresh validation evidence
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.wait-for-validation.outputs.validation_artifact_name }}
          path: 'D:\rfv2\workspace\.artifacts\release-validation\windows-x64'
          github-token: ${{ github.token }}
          run-id: ${{ needs.wait-for-validation.outputs.validation_run_id }}

      - name: Read validation result
        id: validation
        shell: pwsh
        run: |
          $manifestPath = Join-Path $env:MIRA_BENCHMARK_ROOT '.artifacts\release-validation\windows-x64\validation.json'
          $manifest = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
          $eligible = [bool]$manifest.releaseEligible
          "release_eligible=$($eligible.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Validation releaseEligible=$eligible"

      - name: Configure clipper signing key
        shell: pwsh
        env:
          MIRA_CLIPPER_CRX_PROD_PEM: ${{ secrets.MIRA_CLIPPER_CRX_PROD_PEM }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:MIRA_CLIPPER_CRX_PROD_PEM)) {
            throw 'Missing MIRA_CLIPPER_CRX_PROD_PEM required for the full packaging benchmark.'
          }
          $keyRoot = Join-Path $env:MIRA_BENCHMARK_ROOT 'mira-clipper-ext\.keys'
          New-Item -ItemType Directory -Force -Path $keyRoot | Out-Null
          [System.IO.File]::WriteAllText(
            (Join-Path $keyRoot 'mira-clipper-prod.pem'),
            $env:MIRA_CLIPPER_CRX_PROD_PEM,
            [System.Text.UTF8Encoding]::new($false)
          )

      - name: Build shared payload without repeating tests
        id: payload
        shell: pwsh
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          $started = [System.Diagnostics.Stopwatch]::StartNew()
          try {
            if ('${{ steps.validation.outputs.release_eligible }}' -eq 'true') {
              pnpm --dir "$env:MIRA_BENCHMARK_ROOT" release:payload:win:validated
            } else {
              Write-Warning 'Validation contains real test failures. Continuing only for full-build timing; publishing remains blocked.'
              pnpm --dir "$env:MIRA_BENCHMARK_ROOT" release:payload:win:diagnostic
            }
            if ($LASTEXITCODE -ne 0) {
              throw "Payload command failed with exit code $LASTEXITCODE"
            }
          } finally {
            $started.Stop()
            "payload_seconds=$([math]::Round($started.Elapsed.TotalSeconds))" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }

      - name: Upload benchmark shared payload
        uses: actions/upload-artifact@v4
        with:
          name: release-benchmark-payload-windows-x64-${{ github.sha }}
          path: 'D:\rfv2\workspace\.artifacts\release-payload\windows-x64'
          if-no-files-found: error
          retention-days: 2
          compression-level: 0

  package-electron:
    name: Package Electron benchmark
    needs: build-windows-payload
    runs-on: windows-2022
    timeout-minutes: 30
    outputs:
      electron_seconds: ${{ steps.package.outputs.electron_seconds }}
    env:
      MIRA_RELEASE_ALLOW_FAILED_TESTS: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Cache Electron builder
        uses: actions/cache@v4
        with:
          path: |
            ~/AppData/Local/electron-builder/Cache
            ~/.cache/electron-builder
          key: windows-release-factory-electron-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            windows-release-factory-electron-

      - name: Install Electron packaging tools
        run: pnpm install --frozen-lockfile --prefer-offline --filter ui-chat-mira

      - uses: actions/download-artifact@v4
        with:
          name: release-benchmark-payload-windows-x64-${{ github.sha }}
          path: .artifacts/release-payload/windows-x64

      - name: Package Electron from benchmark payload
        id: package
        shell: pwsh
        run: |
          $started = [System.Diagnostics.Stopwatch]::StartNew()
          try {
            pnpm release:package:electron:win
            if ($LASTEXITCODE -ne 0) {
              throw "Electron packaging failed with exit code $LASTEXITCODE"
            }
          } finally {
            $started.Stop()
            "electron_seconds=$([math]::Round($started.Elapsed.TotalSeconds))" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }

      - name: Upload Electron benchmark package
        uses: actions/upload-artifact@v4
        with:
          name: release-benchmark-electron-${{ github.sha }}
          path: |
            .artifacts/release-packages/electron/**/*Setup*.exe
            .artifacts/release-packages/electron/**/*Setup*.exe.blockmap
            .artifacts/release-packages/electron/package-manifest.json
          if-no-files-found: error
          retention-days: 2
          compression-level: 0

  package-tauri:
    name: Package Tauri benchmark
    needs: build-windows-payload
    runs-on: windows-2022
    timeout-minutes: 45
    outputs:
      tauri_seconds: ${{ steps.package.outputs.tauri_seconds }}
    env:
      MIRA_RELEASE_ALLOW_FAILED_TESTS: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust and Tauri build outputs
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri
          cache-on-failure: true

      - name: Install Tauri packaging tools
        run: pnpm install --frozen-lockfile --prefer-offline --filter ui-chat-mira

      - uses: actions/download-artifact@v4
        with:
          name: release-benchmark-payload-windows-x64-${{ github.sha }}
          path: .artifacts/release-payload/windows-x64

      - name: Package Tauri from benchmark payload
        id: package
        shell: pwsh
        run: |
          $started = [System.Diagnostics.Stopwatch]::StartNew()
          try {
            pnpm release:package:tauri:win
            if ($LASTEXITCODE -ne 0) {
              throw "Tauri packaging failed with exit code $LASTEXITCODE"
            }
          } finally {
            $started.Stop()
            "tauri_seconds=$([math]::Round($started.Elapsed.TotalSeconds))" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }

      - name: Upload Tauri benchmark package
        uses: actions/upload-artifact@v4
        with:
          name: release-benchmark-tauri-${{ github.sha }}
          path: |
            .artifacts/release-packages/tauri/**/*.msi
            .artifacts/release-packages/tauri/**/*setup.exe
            .artifacts/release-packages/tauri/package-manifest.json
          if-no-files-found: error
          retention-days: 2
          compression-level: 0

  benchmark-summary:
    name: Full benchmark summary
    needs:
      - wait-for-validation
      - build-windows-payload
      - package-electron
      - package-tauri
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Publish benchmark status
        env:
          GH_TOKEN: ${{ github.token }}
          PAYLOAD_RESULT: ${{ needs.build-windows-payload.result }}
          ELECTRON_RESULT: ${{ needs.package-electron.result }}
          TAURI_RESULT: ${{ needs.package-tauri.result }}
          VALIDATION_ELIGIBLE: ${{ needs.build-windows-payload.outputs.validation_release_eligible }}
          WAIT_SECONDS: ${{ needs.wait-for-validation.outputs.wait_seconds }}
          PAYLOAD_SECONDS: ${{ needs.build-windows-payload.outputs.payload_seconds }}
          ELECTRON_SECONDS: ${{ needs.package-electron.outputs.electron_seconds }}
          TAURI_SECONDS: ${{ needs.package-tauri.outputs.tauri_seconds }}
          BENCHMARK_STARTED_EPOCH: ${{ needs.wait-for-validation.outputs.benchmark_started_epoch }}
        shell: bash
        run: |
          set -euo pipefail
          state='success'
          description='Full V2 benchmark completed; publishing disabled'
          for result in "$PAYLOAD_RESULT" "$ELECTRON_RESULT" "$TAURI_RESULT"; do
            if [[ "$result" != 'success' ]]; then
              state='failure'
              description='Full V2 benchmark build failed'
              break
            fi
          done

          now_epoch=$(date +%s)
          total_seconds=''
          if [[ -n "${BENCHMARK_STARTED_EPOCH:-}" ]]; then
            total_seconds=$((now_epoch - BENCHMARK_STARTED_EPOCH))
          fi

          gh api \
            --method POST \
            -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$state" \
            -f context='release-factory-v2-full-benchmark' \
            -f description="$description" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          {
            echo '### Release Factory V2 Full Benchmark'
            echo
            echo "- Validation release eligible: ${VALIDATION_ELIGIBLE:-unknown}"
            echo "- Validation wait: ${WAIT_SECONDS:-unknown}s"
            echo "- Payload: ${PAYLOAD_RESULT} (${PAYLOAD_SECONDS:-unknown}s)"
            echo "- Electron: ${ELECTRON_RESULT} (${ELECTRON_SECONDS:-unknown}s)"
            echo "- Tauri: ${TAURI_RESULT} (${TAURI_SECONDS:-unknown}s)"
            echo "- Total benchmark wall clock: ${total_seconds:-unknown}s"
            echo '- Tests and coverage: reused fresh artifacts from this exact commit'
            echo '- GitHub Release: blocked'
            echo '- R2 publishing: blocked'
          } >> "$GITHUB_STEP_SUMMARY"

          [[ "$state" == 'success' ]]
