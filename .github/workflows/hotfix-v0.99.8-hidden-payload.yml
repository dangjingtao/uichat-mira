name: Hotfix v0.99.8 Hidden Payload Files

on:
  push:
    branches:
      - release/v0.99.8
    paths:
      - '.github/workflows/hotfix-v0.99.8-hidden-payload.yml'

permissions:
  contents: write

jobs:
  patch-hidden-payload:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release/v0.99.8
          fetch-depth: 0

      - name: Patch frozen payload upload
        shell: pwsh
        run: |
          $path = '.github/workflows/release-factory-v2.yml'
          $lines = [System.Collections.Generic.List[string]](Get-Content -LiteralPath $path)
          $uploadIndex = $lines.IndexOf('      - name: Upload frozen shared payload')
          if ($uploadIndex -lt 0) { throw 'Upload frozen shared payload step not found.' }
          $compressionIndex = -1
          for ($i = $uploadIndex; $i -lt [Math]::Min($lines.Count, $uploadIndex + 20); $i++) {
            if ($lines[$i] -eq '          compression-level: 0') {
              $compressionIndex = $i
              break
            }
          }
          if ($compressionIndex -lt 0) { throw 'Payload compression-level line not found.' }
          if ($lines[$compressionIndex + 1] -ne '          include-hidden-files: true') {
            $lines.Insert($compressionIndex + 1, '          include-hidden-files: true')
          }
          [System.IO.File]::WriteAllLines($path, $lines, [System.Text.UTF8Encoding]::new($false))
          git diff -- $path

      - name: Commit CI fix
        shell: pwsh
        run: |
          Remove-Item -LiteralPath '.github/workflows/hotfix-v0.99.8-hidden-payload.yml' -Force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(release): include hidden files in frozen payload"
          git push origin HEAD:release/v0.99.8
