name: Create v0.99.5 Tag and Build

on:
  push:
    branches:
      - feature/release-factory-v2
    paths:
      - '.github/workflows/tag-v0.99.5.yml'

permissions:
  contents: write

jobs:
  create-tag:
    name: Create v0.99.5 from Release Factory V2
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate version and create tag
        env:
          RELEASE_TAG: v0.99.5
          RELEASE_VERSION: 0.99.5
          TARGET_SHA: ${{ github.sha }}
        shell: bash
        run: |
          package_version=$(node -p "require('./package.json').version")
          if [ "$package_version" != "$RELEASE_VERSION" ]; then
            echo "package.json version ${package_version} does not match ${RELEASE_VERSION}." >&2
            exit 1
          fi

          git fetch origin --tags --force
          if git rev-parse -q --verify "refs/tags/${RELEASE_TAG}" >/dev/null; then
            existing_sha=$(git rev-list -n 1 "${RELEASE_TAG}")
            if [ "${existing_sha}" != "${TARGET_SHA}" ]; then
              echo "Tag ${RELEASE_TAG} already exists at ${existing_sha}, expected ${TARGET_SHA}." >&2
              exit 1
            fi
            echo "Tag ${RELEASE_TAG} already points to ${TARGET_SHA}."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "${RELEASE_TAG}" "${TARGET_SHA}"
          git push origin "refs/tags/${RELEASE_TAG}"
          echo "Created ${RELEASE_TAG} at ${TARGET_SHA}."

  release-factory:
    name: Build v0.99.5 with Release Factory V2
    needs: create-tag
    uses: ./.github/workflows/release-factory-v2.yml
    secrets: inherit
