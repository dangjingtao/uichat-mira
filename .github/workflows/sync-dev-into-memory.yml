name: Sync Dev Into Memory Branch

on:
  push:
    branches:
      - feature/file-memory-kernel
    paths:
      - ".github/workflows/sync-dev-into-memory.yml"

permissions:
  contents: write

jobs:
  sync:
    name: Merge latest dev
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/file-memory-kernel
          fetch-depth: 0

      - name: Merge dev and preserve reconciled settings route
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin dev

          set +e
          git merge --no-ff origin/dev -m "Merge latest dev into feature/file-memory-kernel"
          merge_status=$?
          set -e

          if [[ $merge_status -ne 0 ]]; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            if [[ "$conflicts" != "server/src/routes/general-settings.ts" ]]; then
              echo "Unexpected merge conflicts:"
              printf '%s\n' "$conflicts"
              exit 1
            fi

            git checkout --ours server/src/routes/general-settings.ts
            grep -q 'remoteAccessRoute' server/src/routes/general-settings.ts
            grep -q 'memoryRoute' server/src/routes/general-settings.ts
            git add server/src/routes/general-settings.ts
            git commit --no-edit
          fi

          git push origin HEAD:feature/file-memory-kernel
