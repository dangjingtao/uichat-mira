name: Release Factory V2 Validation

on:
  push:
    branches:
      - feature/release-factory-v2
  workflow_dispatch:
  workflow_call:

concurrency:
  group: release-factory-v2-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-windows-release:
    name: Validate typecheck and tests in hostile Windows path
    runs-on: windows-2022
    timeout-minutes: 50
    env:
      MIRA_VALIDATION_ROOT: 'D:\Mira 构建验证\含 空格 & 符号\workspace'
      CI: 'true'
    steps:
      - name: Checkout source snapshot
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.12.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Stage repository into hostile Windows path
        shell: pwsh
        run: |
          $validationParent = Split-Path -Parent $env:MIRA_VALIDATION_ROOT
          if (Test-Path -LiteralPath $validationParent) {
            Remove-Item -LiteralPath $validationParent -Recurse -Force
          }
          New-Item -ItemType Directory -Force -Path $env:MIRA_VALIDATION_ROOT | Out-Null

          $sourceArchive = Join-Path $env:RUNNER_TEMP 'mira-release-validation-source.zip'
          if (Test-Path -LiteralPath $sourceArchive) {
            Remove-Item -LiteralPath $sourceArchive -Force
          }

          git archive --format=zip --output=$sourceArchive HEAD
          Expand-Archive -LiteralPath $sourceArchive -DestinationPath $env:MIRA_VALIDATION_ROOT -Force
          Write-Host "Validation root: $env:MIRA_VALIDATION_ROOT"

      - name: Install validation dependencies
        shell: pwsh
        run: pnpm --dir "$env:MIRA_VALIDATION_ROOT" install --frozen-lockfile

      - name: Run strict shared release validation
        shell: pwsh
        run: pnpm --dir "$env:MIRA_VALIDATION_ROOT" release:validate:win

      - name: Publish validation summary
        if: always()
        shell: pwsh
        run: |
          $manifestPath = Join-Path $env:MIRA_VALIDATION_ROOT '.artifacts\release-validation\windows-x64\validation.json'
          if (-not (Test-Path -LiteralPath $manifestPath)) {
            '### Windows Release Validation`n`nValidation manifest was not produced.' |
              Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            exit 0
          }

          $manifest = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
          @"
          ### Windows Release Validation

          - Version: `$($manifest.version)`
          - Commit: `$($manifest.gitCommit)`
          - Typecheck: `$($manifest.validation.typecheck.status)`
          - Client tests: `$($manifest.validation.tests.client.status)` (`$($manifest.validation.tests.client.failedTests)` / `$($manifest.validation.tests.client.totalTests)` failed)
          - Server tests: `$($manifest.validation.tests.server.status)` (`$($manifest.validation.tests.server.failedTests)` / `$($manifest.validation.tests.server.totalTests)` failed)
          - Source path: hostile Windows path with Chinese, spaces, and `&`
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-validation-windows-x64-${{ github.sha }}
          path: 'D:\Mira 构建验证\含 空格 & 符号\workspace\.artifacts\release-validation\windows-x64'
          if-no-files-found: warn
          retention-days: 7
          compression-level: 6

  build-windows-payload:
    name: Build payload from frozen validation evidence
    needs: validate-windows-release
    runs-on: windows-2022
    timeout-minutes: 75
    env:
      MIRA_VALIDATION_ROOT: 'D:\Mira 构建验证\含 空格 & 符号\workspace'
      LOCAL_MODEL_RAW_ROOT: 'D:\Mira 构建验证\binary-cache\local-models'
      LOCAL_MODEL_ALLOW_NETWORK: '1'
      CI: 'true'
    steps:
      - name: Checkout source snapshot
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.12.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Stage repository into hostile Windows path
        shell: pwsh
        run: |
          $validationParent = Split-Path -Parent $env:MIRA_VALIDATION_ROOT
          if (Test-Path -LiteralPath $validationParent) {
            Remove-Item -LiteralPath $validationParent -Recurse -Force
          }
          New-Item -ItemType Directory -Force -Path $env:MIRA_VALIDATION_ROOT | Out-Null

          $sourceArchive = Join-Path $env:RUNNER_TEMP 'mira-release-payload-source.zip'
          if (Test-Path -LiteralPath $sourceArchive) {
            Remove-Item -LiteralPath $sourceArchive -Force
          }

          git archive --format=zip --output=$sourceArchive HEAD
          Expand-Archive -LiteralPath $sourceArchive -DestinationPath $env:MIRA_VALIDATION_ROOT -Force
          Write-Host "Payload build root: $env:MIRA_VALIDATION_ROOT"

      - name: Cache Terminal Dev Runtime
        uses: actions/cache@v4
        with:
          path: 'D:\Mira 构建验证\含 空格 & 符号\workspace\.local-runtimes\terminal-dev'
          key: windows-release-factory-terminal-${{ hashFiles('scripts/terminal-runtime.lock.json') }}

      - name: Cache Piper Runtime
        uses: actions/cache@v4
        with:
          path: 'D:\Mira 构建验证\含 空格 & 符号\workspace\.local-runtimes\piper'
          key: windows-release-factory-piper-${{ hashFiles('scripts/prepare-piper-runtime.mjs') }}

      - name: Cache Vivliostyle Runtime
        uses: actions/cache@v4
        with:
          path: 'D:\Mira 构建验证\含 空格 & 符号\workspace\.local-runtimes\vivliostyle'
          key: windows-release-factory-vivliostyle-${{ hashFiles('scripts/prepare-vivliostyle-runtime.mjs') }}

      - name: Cache local model sources
        uses: actions/cache@v4
        with:
          path: 'D:\Mira 构建验证\binary-cache\local-models'
          key: windows-release-factory-models-${{ hashFiles('scripts/prepare-local-model-packs.mjs') }}
          restore-keys: |
            windows-release-factory-models-

      - name: Install packaging dependencies
        shell: pwsh
        run: |
          pnpm --dir "$env:MIRA_VALIDATION_ROOT" install --frozen-lockfile
          npm ci --prefix "$env:MIRA_VALIDATION_ROOT\mira-clipper-ext" --ignore-scripts

      - name: Download frozen validation evidence
        uses: actions/download-artifact@v4
        with:
          name: release-validation-windows-x64-${{ github.sha }}
          path: 'D:\Mira 构建验证\含 空格 & 符号\workspace\.artifacts\release-validation\windows-x64'

      - name: Configure clipper extension signing key
        shell: pwsh
        env:
          MIRA_CLIPPER_CRX_PROD_PEM: ${{ secrets.MIRA_CLIPPER_CRX_PROD_PEM }}
        run: |
          $keyRoot = Join-Path $env:MIRA_VALIDATION_ROOT 'mira-clipper-ext\.keys'
          New-Item -ItemType Directory -Force -Path $keyRoot | Out-Null
          [System.IO.File]::WriteAllText(
            (Join-Path $keyRoot 'mira-clipper-prod.pem'),
            $env:MIRA_CLIPPER_CRX_PROD_PEM,
            [System.Text.UTF8Encoding]::new($false)
          )

      - name: Build shared payload without repeating tests
        shell: pwsh
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: pnpm --dir "$env:MIRA_VALIDATION_ROOT" release:payload:win:validated

      - name: Publish payload summary
        shell: pwsh
        run: |
          $manifestPath = Join-Path $env:MIRA_VALIDATION_ROOT '.artifacts\release-payload\windows-x64\manifest.json'
          $manifest = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
          @"
          ### Shared Windows Payload

          - Version: `$($manifest.version)`
          - Commit: `$($manifest.gitCommit)`
          - Files: `$($manifest.totalFiles)`
          - Bytes: `$($manifest.totalBytes)`
          - Typecheck: `$($manifest.validation.typecheck.status)`
          - Client tests: `$($manifest.validation.tests.client.status)`
          - Server tests: `$($manifest.validation.tests.server.status)`
          - Tests repeated during packaging: `no`
          - Publishing: disabled
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Upload frozen shared payload
        uses: actions/upload-artifact@v4
        with:
          name: release-payload-windows-x64-${{ github.sha }}
          path: 'D:\Mira 构建验证\含 空格 & 符号\workspace\.artifacts\release-payload\windows-x64'
          if-no-files-found: error
          retention-days: 2
          compression-level: 6

  verify-downloaded-payload:
    name: Verify downloaded payload in independent job
    needs: build-windows-payload
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: Checkout verifier
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download frozen shared payload
        uses: actions/download-artifact@v4
        with:
          name: release-payload-windows-x64-${{ github.sha }}
          path: .artifacts/release-payload/windows-x64

      - name: Verify every payload file, validation result, and SHA-256
        run: node scripts/release/verify-payload.mjs

  package-electron-from-payload:
    name: Package Electron from frozen payload
    needs: verify-downloaded-payload
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - name: Checkout Electron consumer
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.12.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Cache Electron builder
        uses: actions/cache@v4
        with:
          path: |
            ~/AppData/Local/electron-builder/Cache
            ~/.cache/electron-builder
          key: windows-release-factory-electron-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            windows-release-factory-electron-

      - name: Install packaging dependencies
        run: pnpm install --frozen-lockfile

      - name: Download frozen shared payload
        uses: actions/download-artifact@v4
        with:
          name: release-payload-windows-x64-${{ github.sha }}
          path: .artifacts/release-payload/windows-x64

      - name: Package Electron without rebuilding product payload
        run: pnpm release:package:electron:win

      - name: Upload Electron validation package
        uses: actions/upload-artifact@v4
        with:
          name: release-factory-electron-${{ github.sha }}
          path: |
            .artifacts/release-packages/electron/**/*Setup*.exe
            .artifacts/release-packages/electron/**/*Setup*.exe.blockmap
            .artifacts/release-packages/electron/package-manifest.json
          if-no-files-found: error
          retention-days: 2

  package-tauri-from-payload:
    name: Package Tauri from frozen payload
    needs: verify-downloaded-payload
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Checkout Tauri consumer
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.12.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust / Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri
          cache-targets: false

      - name: Install packaging dependencies
        run: pnpm install --frozen-lockfile

      - name: Download frozen shared payload
        uses: actions/download-artifact@v4
        with:
          name: release-payload-windows-x64-${{ github.sha }}
          path: .artifacts/release-payload/windows-x64

      - name: Package Tauri without rebuilding product payload
        run: pnpm release:package:tauri:win

      - name: Upload Tauri validation package
        uses: actions/upload-artifact@v4
        with:
          name: release-factory-tauri-${{ github.sha }}
          path: |
            .artifacts/release-packages/tauri/**/*.msi
            .artifacts/release-packages/tauri/**/*setup.exe
            .artifacts/release-packages/tauri/package-manifest.json
          if-no-files-found: error
          retention-days: 2
