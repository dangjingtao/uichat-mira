name: Dispatch v0.99.6 Production Release

on:
  push:
    branches:
      - dev
    paths:
      - '.github/workflows/release-v0.99.6-dispatch.yml'

permissions:
  contents: write
  actions: write

jobs:
  dispatch-release:
    name: Retag dev and dispatch production release
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: v0.99.6
      RELEASE_VERSION: 0.99.6
      TARGET_SHA: 21436f418b20ee59c44f4ff04ae4fbf6035cf2f7
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate clean dev target
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin dev --tags --force
          dev_sha=$(git rev-parse origin/dev)
          if [ "$dev_sha" != "$GITHUB_SHA" ]; then
            echo "dev moved during dispatch: ${dev_sha}, trigger commit=${GITHUB_SHA}" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$TARGET_SHA" "$dev_sha"; then
            echo "Target ${TARGET_SHA} is not part of current dev ${dev_sha}." >&2
            exit 1
          fi
          version=$(git show "${TARGET_SHA}:package.json" | node -e "let s='';process.stdin.on('data',d=>s+=d);process.stdin.on('end',()=>process.stdout.write(JSON.parse(s).version))")
          if [ "$version" != "$RELEASE_VERSION" ]; then
            echo "Target version ${version} does not match ${RELEASE_VERSION}." >&2
            exit 1
          fi

      - name: Recreate release tag on clean dev commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin --tags --force
          if git rev-parse -q --verify "refs/tags/${RELEASE_TAG}" >/dev/null; then
            current_sha=$(git rev-list -n 1 "$RELEASE_TAG")
            if [ "$current_sha" = "$TARGET_SHA" ]; then
              echo "${RELEASE_TAG} already points to ${TARGET_SHA}."
            else
              git push origin ":refs/tags/${RELEASE_TAG}"
              git tag -d "$RELEASE_TAG"
            fi
          fi
          if ! git rev-parse -q --verify "refs/tags/${RELEASE_TAG}" >/dev/null; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag "$RELEASE_TAG" "$TARGET_SHA"
            git push origin "refs/tags/${RELEASE_TAG}"
          fi
          test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$TARGET_SHA"

      - name: Dispatch Release Production from tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api \
            --method POST \
            -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/release-production.yml/dispatches" \
            -f ref="$RELEASE_TAG"
          echo "Dispatched Release Production from ${RELEASE_TAG}@${TARGET_SHA}."