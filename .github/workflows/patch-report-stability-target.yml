name: Format Report Stability Target

on:
  push:
    branches:
      - diagnostic/release-r2-restore
    paths:
      - '.github/workflows/patch-report-stability-target.yml'

permissions:
  contents: write
  statuses: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wip/release-report-stability
          path: target

      - name: Format and update report runner
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euxo pipefail
          cd target
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/release/run-test-scope.mjs')
          text = path.read_text(encoding='utf-8')
          text = text.replace('''  if (result.timedOut) {
          console.error(
            `${scope} shard ${shard} was killed by the release watchdog.`,
          );
          process.exitCode = 124;
        } else if (result.error || !status.blobProduced) {
          console.error(
            `${scope} shard ${shard} did not produce complete merge evidence.`,
          );
          process.exitCode = 1;
        } else if (result.code !== 0) {
          console.warn(
            `${scope} shard ${shard} completed with test assertion failures; evidence is complete and the merged validation gate will report them.`,
          );
        }
        }''', '''  if (result.timedOut) {
            console.error(
              `${scope} shard ${shard} was killed by the release watchdog.`,
            );
            process.exitCode = 124;
          } else if (result.error || !status.blobProduced) {
            console.error(
              `${scope} shard ${shard} did not produce complete merge evidence.`,
            );
            process.exitCode = 1;
          } else if (result.code !== 0) {
            console.warn(
              `${scope} shard ${shard} completed with test assertion failures; evidence is complete and the merged validation gate will report them.`,
            );
          }
        }''')
          text = text.replace('''  const testsPassed = writeReports(rawResultsPath);
        if (!testsPassed || result.code !== 0) {
          console.warn(
            `${scope} merged reports are complete and contain test assertion failures; the combined validation gate will report them.`,
          );
        }
        }''', '''  const testsPassed = writeReports(rawResultsPath);
          if (!testsPassed || result.code !== 0) {
            console.warn(
              `${scope} merged reports are complete and contain test assertion failures; the combined validation gate will report them.`,
            );
          }
        }''')
          path.write_text(text, encoding='utf-8')
          PY

          node --check scripts/release/run-test-scope.mjs
          current_sha=$(gh api "/repos/${GITHUB_REPOSITORY}/contents/scripts/release/run-test-scope.mjs?ref=wip/release-report-stability" --jq .sha)
          content=$(base64 -w0 scripts/release/run-test-scope.mjs)
          gh api \
            --method PUT \
            "/repos/${GITHUB_REPOSITORY}/contents/scripts/release/run-test-scope.mjs" \
            -f message='style(release): format report stability contract' \
            -f content="$content" \
            -f branch='wip/release-report-stability' \
            -f sha="$current_sha"

      - name: Publish success status
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'success',
              context: 'release-report-stability-format',
              description: 'Report runner formatting completed',
              target_url: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
            });
