name: Patch Report Stability Target

on:
  push:
    branches:
      - diagnostic/release-r2-restore
    paths:
      - '.github/workflows/patch-report-stability-target.yml'

permissions:
  contents: write
  statuses: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Publish running status
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              context: 'release-report-stability-patch',
              description: 'Patching report exit-code contract',
              target_url: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
            });

      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          ref: wip/release-report-stability
          path: target
          fetch-depth: 0

      - name: Patch assertion exit-code handling
        shell: bash
        run: |
          cd target
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/release/run-test-scope.mjs')
          text = path.read_text(encoding='utf-8')

          old_shard = '''  if (result.timedOut) {
            console.error(
              `${scope} shard ${shard} was killed by the release watchdog.`,
            );
            process.exitCode = 124;
          } else if (result.code !== 0) {
            process.exitCode = result.code;
          }
          '''
          new_shard = '''  if (result.timedOut) {
            console.error(
              `${scope} shard ${shard} was killed by the release watchdog.`,
            );
            process.exitCode = 124;
          } else if (result.error || !status.blobProduced) {
            console.error(
              `${scope} shard ${shard} did not produce complete merge evidence.`,
            );
            process.exitCode = 1;
          } else if (result.code !== 0) {
            console.warn(
              `${scope} shard ${shard} completed with test assertion failures; evidence is complete and the merged validation gate will report them.`,
            );
          }
          '''

          old_merge = '''  const success = writeReports(rawResultsPath);
            if (!success || result.code !== 0) {
              process.exitCode = result.code || 1;
            }
          '''
          new_merge = '''  const testsPassed = writeReports(rawResultsPath);
            if (!testsPassed || result.code !== 0) {
              console.warn(
                `${scope} merged reports are complete and contain test assertion failures; the combined validation gate will report them.`,
              );
            }
          '''

          if old_shard not in text:
            raise SystemExit('runShard exit-code block not found')
          if old_merge not in text:
            raise SystemExit('mergeShards exit-code block not found')

          path.write_text(
              text.replace(old_shard, new_shard, 1).replace(old_merge, new_merge, 1),
              encoding='utf-8',
          )
          PY

          node --check scripts/release/run-test-scope.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/release/run-test-scope.mjs
          git commit -m 'fix(release): separate report generation from assertion gate'
          git push origin HEAD:wip/release-report-stability

      - name: Publish success status
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'success',
              context: 'release-report-stability-patch',
              description: 'Report exit-code contract patched',
              target_url: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
            });

      - name: Publish failure status
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'failure',
              context: 'release-report-stability-patch',
              description: 'Report exit-code patch failed',
              target_url: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
            });
