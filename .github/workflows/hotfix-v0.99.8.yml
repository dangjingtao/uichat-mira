name: Repair v0.99.8 Release

on:
  push:
    branches:
      - release/v0.99.8
    paths:
      - '.github/workflows/hotfix-v0.99.8.yml'

permissions:
  contents: write
  actions: write

jobs:
  repair-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release/v0.99.8
          fetch-depth: 0

      - name: Patch relay request body type
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('server/src/services/remote-relay-connector.service.ts')
          text = path.read_text(encoding='utf-8')
          old = '...(body?.byteLength ? { body } : {}),'
          new = '...(body?.byteLength ? { body: new Uint8Array(body) } : {}),'
          if old not in text:
              raise SystemExit('Expected relay fetch body pattern not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.12.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Verify server typecheck
        run: pnpm --filter @ui-chat-mira/server typecheck

      - name: Commit repair and remove one-shot workflows
        shell: bash
        run: |
          rm -f .github/workflows/hotfix-v0.99.8.yml .github/workflows/tag-v0.99.8.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/src/services/remote-relay-connector.service.ts .github/workflows
          git commit -m 'fix(relay): normalize request body for fetch'
          git push origin HEAD:release/v0.99.8

      - name: Move failed unpublished tag to repaired commit
        shell: bash
        run: |
          git tag -f v0.99.8 HEAD
          git push --force origin refs/tags/v0.99.8

      - name: Trigger production release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release-production.yml --ref v0.99.8
