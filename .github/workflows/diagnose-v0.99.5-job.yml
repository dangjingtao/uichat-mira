name: Patch Sharded Release Factory Speed Workflow

on:
  push:
    branches:
      - diagnostic/release-v0.99.5-job-89769278798
    paths:
      - '.github/workflows/diagnose-v0.99.5-job.yml'

permissions:
  contents: write

jobs:
  patch-sharded-release-factory:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@v4

      - name: Checkout speed branch
        uses: actions/checkout@v4
        with:
          ref: wip/release-factory-speed
          path: speed-source
          fetch-depth: 0

      - name: Replace blocking validation with sharded watchdog validation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          root = Path('speed-source')
          workflow_path = root / '.github/workflows/release-factory-v2.yml'
          workflow = workflow_path.read_text(encoding='utf-8')

          start = workflow.index('  validate-client-tests:\n')
          end = workflow.index('  build-windows-payload:\n')
          validation_jobs = r'''  validate-client-shards:
            name: Client tests shard ${{ matrix.shard }}/2
            runs-on: windows-2022
            timeout-minutes: 15
            strategy:
              fail-fast: false
              matrix:
                shard: [1, 2]
            steps:
              - uses: actions/checkout@v4

              - uses: pnpm/action-setup@v3
                with:
                  version: 9.12.0

              - uses: actions/setup-node@v4
                with:
                  node-version: 22
                  cache: pnpm

              - name: Install client test dependencies
                run: pnpm install --frozen-lockfile --prefer-offline --filter @ui-chat-mira/desktop...

              - name: Run client shard with fresh coverage and watchdog
                id: tests
                continue-on-error: true
                run: node scripts/release/run-test-scope.mjs --scope=client --shard=${{ matrix.shard }}/2 --timeout-seconds=480

              - name: Upload client shard evidence
                if: always()
                uses: actions/upload-artifact@v4
                with:
                  name: release-validation-client-shard-${{ matrix.shard }}-${{ github.sha }}
                  path: .artifacts/release-validation/windows-x64/shards/client/${{ matrix.shard }}-of-2
                  if-no-files-found: error
                  retention-days: 2
                  compression-level: 0

              - name: Enforce client shard result
                if: always()
                shell: pwsh
                run: |
                  if ('${{ steps.tests.outcome }}' -ne 'success') { exit 1 }

          merge-client-validation:
            name: Merge client tests and coverage
            needs: validate-client-shards
            if: always()
            runs-on: windows-2022
            timeout-minutes: 10
            steps:
              - uses: actions/checkout@v4

              - uses: pnpm/action-setup@v3
                with:
                  version: 9.12.0

              - uses: actions/setup-node@v4
                with:
                  node-version: 22
                  cache: pnpm

              - name: Install client merge dependencies
                run: pnpm install --frozen-lockfile --prefer-offline --filter @ui-chat-mira/desktop...

              - name: Download client shard reports
                uses: actions/download-artifact@v4
                with:
                  pattern: release-validation-client-shard-*-${{ github.sha }}
                  path: .artifacts/release-validation/windows-x64/shards/client
                  merge-multiple: true

              - name: Merge client reports and coverage
                id: merge
                continue-on-error: true
                run: node scripts/release/run-test-scope.mjs --scope=client --merge-dir=.artifacts/release-validation/windows-x64/shards/client --expected-shards=2

              - name: Upload merged client validation
                if: always()
                uses: actions/upload-artifact@v4
                with:
                  name: release-validation-client-${{ github.sha }}
                  path: .artifacts/release-validation/windows-x64
                  if-no-files-found: error
                  retention-days: 2

              - name: Enforce merged client result
                if: always()
                shell: pwsh
                run: |
                  if ('${{ steps.merge.outcome }}' -ne 'success') { exit 1 }

          validate-server-environment:
            name: Validate server test prerequisites
            runs-on: windows-2022
            timeout-minutes: 8
            steps:
              - uses: actions/checkout@v4

              - uses: actions/setup-python@v5
                with:
                  python-version: '3.12'

              - name: Cache Python validation modules
                id: python-cache
                uses: actions/cache@v4
                with:
                  path: ${{ runner.temp }}\mira-python-validation
                  key: windows-python-validation-3.12-${{ hashFiles('scripts/release/requirements-validation.txt') }}

              - name: Validate server prerequisites
                id: environment
                continue-on-error: true
                shell: pwsh
                run: |
                  $pythonTarget = Join-Path $env:RUNNER_TEMP 'mira-python-validation'
                  New-Item -ItemType Directory -Force -Path $pythonTarget | Out-Null
                  "PYTHONPATH=$pythonTarget" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
                  if ('${{ steps.python-cache.outputs.cache-hit }}' -ne 'true') {
                    python -m pip install `
                      --disable-pip-version-check `
                      --target "$pythonTarget" `
                      -r scripts/release/requirements-validation.txt
                  }
                  New-Item -ItemType Directory -Force -Path '.test-artifact\server\workspace' | Out-Null
                  New-Item -ItemType Directory -Force -Path 'server\.test-artifact' | Out-Null
                  python -c "import docx; import pptx; import openpyxl"
                  where.exe pdftotext.exe

              - name: Write environment fragment
                if: always()
                shell: pwsh
                run: |
                  $status = if ('${{ steps.environment.outcome }}' -eq 'success') { 'passed' } else { 'failed' }
                  $detail = if ($status -eq 'passed') { 'Release test prerequisites passed.' } else { 'Release test prerequisite check failed.' }
                  $target = '.artifacts\release-validation\windows-x64\fragments\environment.json'
                  New-Item -ItemType Directory -Force -Path (Split-Path -Parent $target) | Out-Null
                  @{
                    status = $status
                    detail = $detail
                    testArtifactDirectories = $status
                    pythonOfficeDependencies = $status
                    pdfTextExtractor = $status
                  } | ConvertTo-Json | Out-File -LiteralPath $target -Encoding utf8

              - name: Upload environment fragment
                if: always()
                uses: actions/upload-artifact@v4
                with:
                  name: release-validation-environment-${{ github.sha }}
                  path: .artifacts/release-validation/windows-x64
                  if-no-files-found: error
                  retention-days: 2

              - name: Enforce environment result
                if: always()
                shell: pwsh
                run: |
                  if ('${{ steps.environment.outcome }}' -ne 'success') { exit 1 }

          validate-server-shards:
            name: Server tests shard ${{ matrix.shard }}/4
            needs: validate-server-environment
            runs-on: windows-2022
            timeout-minutes: 15
            strategy:
              fail-fast: false
              matrix:
                shard: [1, 2, 3, 4]
            steps:
              - uses: actions/checkout@v4

              - uses: pnpm/action-setup@v3
                with:
                  version: 9.12.0

              - uses: actions/setup-node@v4
                with:
                  node-version: 22
                  cache: pnpm

              - uses: actions/setup-python@v5
                with:
                  python-version: '3.12'

              - name: Restore Python validation modules
                uses: actions/cache@v4
                with:
                  path: ${{ runner.temp }}\mira-python-validation
                  key: windows-python-validation-3.12-${{ hashFiles('scripts/release/requirements-validation.txt') }}

              - name: Configure server test environment
                shell: pwsh
                run: |
                  $pythonTarget = Join-Path $env:RUNNER_TEMP 'mira-python-validation'
                  "PYTHONPATH=$pythonTarget" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
                  New-Item -ItemType Directory -Force -Path '.test-artifact\server\workspace' | Out-Null
                  New-Item -ItemType Directory -Force -Path 'server\.test-artifact' | Out-Null

              - name: Install server test dependencies
                run: pnpm install --frozen-lockfile --prefer-offline --filter @ui-chat-mira/server...

              - name: Run server shard with fresh coverage and watchdog
                id: tests
                continue-on-error: true
                run: node scripts/release/run-test-scope.mjs --scope=server --shard=${{ matrix.shard }}/4 --timeout-seconds=480

              - name: Upload server shard evidence
                if: always()
                uses: actions/upload-artifact@v4
                with:
                  name: release-validation-server-shard-${{ matrix.shard }}-${{ github.sha }}
                  path: .artifacts/release-validation/windows-x64/shards/server/${{ matrix.shard }}-of-4
                  if-no-files-found: error
                  retention-days: 2
                  compression-level: 0

              - name: Enforce server shard result
                if: always()
                shell: pwsh
                run: |
                  if ('${{ steps.tests.outcome }}' -ne 'success') { exit 1 }

          merge-server-validation:
            name: Merge server tests and coverage
            needs: validate-server-shards
            if: always()
            runs-on: windows-2022
            timeout-minutes: 10
            steps:
              - uses: actions/checkout@v4

              - uses: pnpm/action-setup@v3
                with:
                  version: 9.12.0

              - uses: actions/setup-node@v4
                with:
                  node-version: 22
                  cache: pnpm

              - name: Install server merge dependencies
                run: pnpm install --frozen-lockfile --prefer-offline --filter @ui-chat-mira/server...

              - name: Download server shard reports
                uses: actions/download-artifact@v4
                with:
                  pattern: release-validation-server-shard-*-${{ github.sha }}
                  path: .artifacts/release-validation/windows-x64/shards/server
                  merge-multiple: true

              - name: Merge server reports and coverage
                id: merge
                continue-on-error: true
                run: node scripts/release/run-test-scope.mjs --scope=server --merge-dir=.artifacts/release-validation/windows-x64/shards/server --expected-shards=4

              - name: Upload merged server validation
                if: always()
                uses: actions/upload-artifact@v4
                with:
                  name: release-validation-server-${{ github.sha }}
                  path: .artifacts/release-validation/windows-x64
                  if-no-files-found: error
                  retention-days: 2

              - name: Enforce merged server result
                if: always()
                shell: pwsh
                run: |
                  if ('${{ steps.merge.outcome }}' -ne 'success') { exit 1 }

          assemble-validation:
            name: Assemble validation evidence
            needs:
              - validate-typecheck
              - validate-server-environment
              - merge-client-validation
              - merge-server-validation
            if: always()
            runs-on: ubuntu-latest
            timeout-minutes: 8
            steps:
              - uses: actions/checkout@v4

              - uses: actions/setup-node@v4
                with:
                  node-version: 22

              - name: Download typecheck fragment
                uses: actions/download-artifact@v4
                with:
                  name: release-validation-typecheck-${{ github.sha }}
                  path: .artifacts/release-validation/windows-x64

              - name: Download environment fragment
                uses: actions/download-artifact@v4
                with:
                  name: release-validation-environment-${{ github.sha }}
                  path: .artifacts/release-validation/windows-x64

              - name: Download merged client validation
                uses: actions/download-artifact@v4
                with:
                  name: release-validation-client-${{ github.sha }}
                  path: .artifacts/release-validation/windows-x64

              - name: Download merged server validation
                uses: actions/download-artifact@v4
                with:
                  name: release-validation-server-${{ github.sha }}
                  path: .artifacts/release-validation/windows-x64

              - name: Combine validation manifest
                id: combine
                continue-on-error: true
                run: node scripts/release/combine-validation.mjs

              - name: Upload combined validation evidence
                if: always()
                uses: actions/upload-artifact@v4
                with:
                  name: release-validation-windows-x64-${{ github.sha }}
                  path: .artifacts/release-validation/windows-x64
                  if-no-files-found: error
                  retention-days: 7
                  compression-level: 6

              - name: Enforce combined validation result
                if: always()
                run: test '${{ steps.combine.outcome }}' = 'success'

          '''
          workflow = workflow[:start] + validation_jobs + workflow[end:]

          workflow = workflow.replace(
              '  build-windows-payload:\n    name: Prepare and assemble shared Windows payload\n',
              '  build-windows-payload:\n    name: Prepare and assemble shared Windows payload\n    needs: assemble-validation\n',
              1,
          )
          workflow = workflow.replace(
              '      - name: Prepare payload components while validation runs\n',
              '      - name: Prepare payload components after validation\n',
              1,
          )

          wait_start = workflow.index('      - name: Wait for combined validation artifact\n')
          wait_end = workflow.index('      - name: Download combined validation evidence\n', wait_start)
          workflow = workflow[:wait_start] + workflow[wait_end:]
          workflow = workflow.replace("            echo '- Coverage in release path: disabled'", "            echo '- Coverage in release path: fresh and merged'", 1)
          workflow_path.write_text(workflow, encoding='utf-8')

          script_path = root / 'scripts/release/run-test-scope.mjs'
          script = script_path.read_text(encoding='utf-8')
          script = script.replace(
              'const timeoutSeconds = Number(readArg("--timeout-seconds") || "480");',
              'const timeoutSeconds = Number(readArg("--timeout-seconds") || "480");\nconst expectedShards = Number(readArg("--expected-shards") || "0");',
              1,
          )
          script = script.replace(
              '  const statusPath = path.join(shardDir, "status.json");',
              '  const statusPath = path.join(shardDir, `${scope}-${safeShard}.status.json`);',
              1,
          )
          script = script.replace(
              '    "--reporter=blob",\n    "--reporter=hanging-process",',
              '    "--reporter=blob",',
              1,
          )
          script = script.replace(
              '  if (scope === "server") {\n    vitestArgs.push("--pool=forks", "--maxWorkers=2");\n  }',
              '  if (scope === "server") {\n    vitestArgs.push("--reporter=hanging-process", "--pool=forks", "--maxWorkers=2");\n  }',
              1,
          )
          marker = '''  if (!fs.existsSync(mergeDir)) {
              throw new Error(`Missing ${scope} shard reports: ${mergeDir}`);
            }

            fs.rmSync(reportDir, { recursive: true, force: true });'''
          replacement = '''  if (!fs.existsSync(mergeDir)) {
              throw new Error(`Missing ${scope} shard reports: ${mergeDir}`);
            }

            const statusFiles = fs.readdirSync(mergeDir)
              .filter((filename) => filename.endsWith(".status.json"))
              .map((filename) => path.join(mergeDir, filename));
            if (expectedShards > 0 && statusFiles.length !== expectedShards) {
              throw new Error(
                `Expected ${expectedShards} ${scope} shard statuses, received ${statusFiles.length}.`,
              );
            }
            const statuses = statusFiles.map(readJson);
            const incomplete = statuses.filter(
              (status) => status.timedOut || !status.blobProduced,
            );
            if (incomplete.length > 0) {
              throw new Error(
                `${scope} shard watchdog blocked merge: ${incomplete
                  .map((status) => `${status.shard}:${status.timedOut ? "timeout" : "missing-blob"}`)
                  .join(", ")}`,
              );
            }

            fs.rmSync(reportDir, { recursive: true, force: true });'''
          if marker not in script:
              raise SystemExit('Expected merge marker not found in run-test-scope.mjs')
          script = script.replace(marker, replacement, 1)
          script_path.write_text(script, encoding='utf-8')
          PY

      - name: Install actionlint
        shell: bash
        run: bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)

      - name: Validate patched workflow and scripts
        shell: bash
        run: |
          set -euo pipefail
          cd speed-source
          ../actionlint -no-color .github/workflows/release-factory-v2.yml
          node --check scripts/release/run-test-scope.mjs
          node --check scripts/release/combine-validation.mjs
          node --check scripts/release/assemble-payload.mjs
          grep -q -- '--shard=${{ matrix.shard }}/4' .github/workflows/release-factory-v2.yml
          grep -q -- '--timeout-seconds=480' .github/workflows/release-factory-v2.yml
          ! grep -q 'Wait for combined validation artifact' .github/workflows/release-factory-v2.yml
          grep -q 'needs: assemble-validation' .github/workflows/release-factory-v2.yml

      - name: Commit optimized workflow
        shell: bash
        run: |
          cd speed-source
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/release-factory-v2.yml scripts/release/run-test-scope.mjs
          git commit -m 'perf(release): shard validation with hard watchdogs'
          git push origin HEAD:wip/release-factory-speed

      - name: Record diagnostic result
        shell: bash
        run: |
          {
            echo 'actionlint: passed'
            echo 'node syntax: passed'
            echo 'client shards: 2'
            echo 'server shards: 4'
            echo 'per-shard watchdog: 480 seconds'
            echo 'payload polling: removed'
            echo 'business logic changes: none'
          } > diagnostics/release-factory-speed-smoke.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add diagnostics/release-factory-speed-smoke.txt
          git commit -m 'chore: record sharded release workflow validation [skip ci]'
          git push
