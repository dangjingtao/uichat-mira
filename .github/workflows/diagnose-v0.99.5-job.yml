name: Lint Release Factory Speed Workflow

on:
  push:
    branches:
      - diagnostic/release-v0.99.5-job-89769278798
    paths:
      - '.github/workflows/diagnose-v0.99.5-job.yml'

permissions:
  contents: write

jobs:
  lint-workflow:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@v4

      - name: Checkout speed branch
        uses: actions/checkout@v4
        with:
          ref: wip/release-factory-speed
          path: speed-source

      - name: Install actionlint
        shell: bash
        run: bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)

      - name: Lint optimized workflow
        shell: bash
        run: |
          set +e
          ./actionlint -no-color speed-source/.github/workflows/release-factory-v2.yml > actionlint-output.txt 2>&1
          exit_code=$?
          set -e
          {
            echo "actionlint_exit_code: ${exit_code}"
            echo
            cat actionlint-output.txt
          } > diagnostics/release-factory-speed-actionlint.txt

      - name: Commit lint result
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add diagnostics/release-factory-speed-actionlint.txt
          git commit -m 'chore: lint release speed workflow [skip ci]'
          git push
