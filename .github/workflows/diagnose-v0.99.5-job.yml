name: Patch Release Factory Workflow Context

on:
  push:
    branches:
      - diagnostic/release-v0.99.5-job-89769278798
    paths:
      - '.github/workflows/diagnose-v0.99.5-job.yml'

permissions:
  contents: write

jobs:
  patch-workflow:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release factory branch
        uses: actions/checkout@v4
        with:
          ref: feature/release-factory-v2
          fetch-depth: 0

      - name: Move runner temp resolution into the step
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/release-factory-v2.yml')
          lines = path.read_text(encoding='utf-8').splitlines()
          lines = [
              line for line in lines
              if not line.strip().startswith('PYTHONPATH:')
          ]
          text = '\n'.join(lines) + '\n'

          old = '''      - name: Install validation dependencies
        shell: pwsh
        run: |
          pnpm --dir "$env:MIRA_VALIDATION_ROOT" install --frozen-lockfile
          python -m pip install `
            --disable-pip-version-check `
            --target "$env:PYTHONPATH" `
'''
          new = '''      - name: Install validation dependencies
        shell: pwsh
        run: |
          $pythonTarget = Join-Path $env:RUNNER_TEMP 'mira-python-validation'
          "PYTHONPATH=$pythonTarget" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          pnpm --dir "$env:MIRA_VALIDATION_ROOT" install --frozen-lockfile
          python -m pip install `
            --disable-pip-version-check `
            --target "$pythonTarget" `
'''
          if old not in text:
              raise SystemExit('Expected validation dependency block was not found.')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit workflow fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/release-factory-v2.yml
          git commit -m 'fix(release): resolve runner temp inside validation step'
          git push origin HEAD:feature/release-factory-v2
