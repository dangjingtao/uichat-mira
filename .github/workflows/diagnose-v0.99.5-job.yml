name: Patch And Smoke Release Factory Speed Scripts

on:
  push:
    branches:
      - diagnostic/release-v0.99.5-job-89769278798
    paths:
      - '.github/workflows/diagnose-v0.99.5-job.yml'

permissions:
  contents: write

jobs:
  patch-and-smoke-speed-scripts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@v4

      - name: Checkout speed branch
        uses: actions/checkout@v4
        with:
          ref: wip/release-factory-speed
          path: speed-source
          fetch-depth: 0

      - name: Correct coverage labels on speed branch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('speed-source/.github/workflows/release-factory-v2.yml')
          text = path.read_text(encoding='utf-8')
          text = text.replace('Run client tests without coverage', 'Run client tests with fresh coverage')
          text = text.replace('Run server tests without coverage', 'Run server tests with fresh coverage')
          path.write_text(text, encoding='utf-8')
          PY

          cd speed-source
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add .github/workflows/release-factory-v2.yml
            git commit -m 'fix(release): describe fresh coverage validation'
            git push origin HEAD:wip/release-factory-speed
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install actionlint
        shell: bash
        run: bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)

      - name: Run static and manifest smoke checks
        shell: bash
        run: |
          set -euo pipefail
          cd speed-source

          git pull --ff-only origin wip/release-factory-speed
          ../actionlint -no-color .github/workflows/release-factory-v2.yml
          node --check scripts/release/run-test-scope.mjs
          node --check scripts/release/combine-validation.mjs
          node --check scripts/release/assemble-payload.mjs

          root='.artifacts/release-validation/windows-x64'
          mkdir -p "$root/fragments" "$root/reports/client" "$root/reports/server"
          printf '%s\n' '{"status":"passed"}' > "$root/fragments/typecheck.json"
          printf '%s\n' '{"status":"passed","detail":"smoke","testArtifactDirectories":"passed","pythonOfficeDependencies":"passed","pdfTextExtractor":"passed"}' > "$root/fragments/environment.json"
          for scope in client server; do
            cat > "$root/reports/$scope/test-report.json" <<JSON
          {
            "schemaVersion": 1,
            "scope": "$scope",
            "summary": {
              "success": true,
              "totalTests": 1,
              "passedTests": 1,
              "failedTests": 0,
              "totalSuites": 1,
              "passedSuites": 1,
              "failedSuites": 0
            },
            "suites": []
          }
          JSON
            printf '%s\n' '{"schemaVersion":1,"available":true,"summary":{"total":{}},"files":[]}' > "$root/reports/$scope/coverage-report.json"
          done

          GITHUB_SHA='smoke-release-speed' node scripts/release/combine-validation.mjs
          node -e "const m=require('fs').readFileSync('$root/validation.json','utf8'); const v=JSON.parse(m); if(!v.releaseEligible) process.exit(1);"

          {
            echo 'actionlint: passed'
            echo 'node syntax: passed'
            echo 'validation combine: passed'
            echo 'fresh coverage contract: preserved'
          } > ../diagnostics/release-factory-speed-smoke.txt

      - name: Commit smoke result
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add diagnostics/release-factory-speed-smoke.txt
          git commit -m 'chore: smoke fresh coverage release flow [skip ci]'
          git push
