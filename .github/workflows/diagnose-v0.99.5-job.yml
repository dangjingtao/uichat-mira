name: Inspect Release Factory Branch Run

on:
  push:
    branches:
      - diagnostic/release-v0.99.5-job-89769278798
    paths:
      - '.github/workflows/diagnose-v0.99.5-job.yml'

permissions:
  actions: read
  contents: write

jobs:
  inspect-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@v4

      - name: Capture target run and jobs
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: '1fe3610646018666b3a6f2aa2af70962bcef7a49'
        shell: bash
        run: |
          set -euo pipefail
          gh api "/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${TARGET_SHA}&per_page=20" > runs.json
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          target_sha = os.environ['TARGET_SHA']
          payload = json.loads(Path('runs.json').read_text(encoding='utf-8'))
          runs = payload.get('workflow_runs', [])
          output = [f'Target SHA: {target_sha}', f'Run count: {len(runs)}', '']

          for run in runs:
              run_id = run.get('id')
              output.extend([
                  f'run_id: {run_id}',
                  f'name: {run.get("name")}',
                  f'event: {run.get("event")}',
                  f'status: {run.get("status")}',
                  f'conclusion: {run.get("conclusion")}',
                  f'url: {run.get("html_url")}',
              ])
              jobs_raw = subprocess.check_output([
                  'gh', 'api',
                  f'/repos/{os.environ["GITHUB_REPOSITORY"]}/actions/runs/{run_id}/jobs?per_page=100',
              ], text=True)
              jobs = json.loads(jobs_raw).get('jobs', [])
              for job in jobs:
                  output.append(
                      f'  job {job.get("id")}: {job.get("name")} | '
                      f'{job.get("status")} | {job.get("conclusion")}'
                  )
              output.append('')

          target = Path('diagnostics/latest-release-factory-status.txt')
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text('\n'.join(output) + '\n', encoding='utf-8')
          PY

      - name: Commit status snapshot
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add diagnostics/latest-release-factory-status.txt
          git commit -m 'chore: inspect split release factory run [skip ci]'
          git push
