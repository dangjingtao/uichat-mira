name: Diagnose v0.99.5 Failed Job

on:
  push:
    branches:
      - diagnostic/release-v0.99.5-job-89769278798
    paths:
      - '.github/workflows/diagnose-v0.99.5-job.yml'

permissions:
  actions: read
  contents: write

jobs:
  extract-failure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@v4

      - name: Download and normalize failed test log
        env:
          GH_TOKEN: ${{ github.token }}
          FAILED_JOB_ID: '89773190647'
        shell: bash
        run: |
          set -euo pipefail
          gh api "/repos/${GITHUB_REPOSITORY}/actions/jobs/${FAILED_JOB_ID}/logs" > failed-job.log
          python - <<'PY'
          import re
          from pathlib import Path

          job_id = '89773190647'
          text = Path('failed-job.log').read_text(
              encoding='utf-8-sig', errors='replace'
          )
          ansi = re.compile(r'\x1b\[[0-?]*[ -/]*[@-~]')
          lines = [ansi.sub('', line) for line in text.splitlines()]

          numbered = [f'{index:04d}: {line}' for index, line in enumerate(lines, start=1)]
          target = Path(f'diagnostics/v0.99.5-job-{job_id}-clean.txt')
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text('\n'.join(numbered) + '\n', encoding='utf-8')

          patterns = (
              ' FAIL ', '×', 'AssertionError', 'Test Files', 'Tests  ',
              'expected', 'received', 'failed tests', 'failed suites',
              'Unhandled', 'TypeError:', 'ReferenceError:', 'Error:',
          )
          match_indexes = []
          for index, line in enumerate(lines):
              lowered = line.lower()
              if any(pattern.lower() in lowered for pattern in patterns):
                  match_indexes.append(index)

          selected = set()
          for index in match_indexes:
              selected.update(range(max(0, index - 3), min(len(lines), index + 8)))

          excerpt = [
              f'Source job: {job_id}',
              f'Total lines: {len(lines)}',
              f'Matched lines: {len(match_indexes)}',
              '',
          ]
          last = None
          for index in sorted(selected):
              if last is not None and index > last + 1:
                  excerpt.append('...')
              excerpt.append(f'{index + 1:04d}: {lines[index]}')
              last = index

          Path(f'diagnostics/v0.99.5-job-{job_id}-test-excerpts.txt').write_text(
              '\n'.join(excerpt) + '\n',
              encoding='utf-8',
          )
          PY

      - name: Commit normalized diagnostics
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add diagnostics/v0.99.5-job-89773190647-clean.txt diagnostics/v0.99.5-job-89773190647-test-excerpts.txt
          git commit -m 'chore: normalize v0.99.5 test failure log [skip ci]'
          git push
