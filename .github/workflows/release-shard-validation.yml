name: Release Shard Validation

on:
  push:
    branches:
      - wip/release-factory-speed
    paths:
      - '.github/workflows/release-shard-validation.yml'

permissions:
  contents: read
  statuses: write

concurrency:
  group: release-shard-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  start:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              context: 'release-shard-validation',
              description: 'Full sharded tests and coverage are running',
              target_url: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
            });

  client-shards:
    name: Client ${{ matrix.shard }}/2
    runs-on: windows-2022
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline --filter @ui-chat-mira/desktop...
      - name: Run current client shard with fresh coverage
        id: tests
        continue-on-error: true
        run: node scripts/release/run-test-scope.mjs --scope=client --shard=${{ matrix.shard }}/2 --timeout-seconds=480
      - name: Upload client shard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-client-shard-${{ matrix.shard }}-${{ github.sha }}
          path: .artifacts/release-validation/windows-x64/shards/client/${{ matrix.shard }}-of-2
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          include-hidden-files: true
      - name: Enforce test result after evidence upload
        if: always()
        shell: pwsh
        run: if ('${{ steps.tests.outcome }}' -ne 'success') { exit 1 }

  merge-client:
    name: Merge client tests and coverage
    needs: client-shards
    if: always()
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline --filter @ui-chat-mira/desktop...
      - uses: actions/download-artifact@v4
        with:
          pattern: final-client-shard-*-${{ github.sha }}
          path: .artifacts/release-validation/windows-x64/shards/client
          merge-multiple: true
      - name: Merge client blob reports
        id: merge
        continue-on-error: true
        run: node scripts/release/run-test-scope.mjs --scope=client --merge-dir=.artifacts/release-validation/windows-x64/shards/client --expected-shards=2
      - name: Upload merged client reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-client-merged-${{ github.sha }}
          path: .artifacts/release-validation/windows-x64/reports/client
          if-no-files-found: warn
          retention-days: 1
          include-hidden-files: true
      - name: Enforce merged result after report upload
        if: always()
        shell: pwsh
        run: if ('${{ steps.merge.outcome }}' -ne 'success') { exit 1 }

  server-environment:
    name: Server prerequisites
    runs-on: windows-2022
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cache Python validation modules
        id: python-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\mira-python-validation
          key: final-python-3.12-${{ hashFiles('scripts/release/requirements-validation.txt') }}
      - name: Check prerequisites
        shell: pwsh
        run: |
          $pythonTarget = Join-Path $env:RUNNER_TEMP 'mira-python-validation'
          New-Item -ItemType Directory -Force -Path $pythonTarget | Out-Null
          if ('${{ steps.python-cache.outputs.cache-hit }}' -ne 'true') {
            python -m pip install --disable-pip-version-check --target "$pythonTarget" -r scripts/release/requirements-validation.txt
          }
          $env:PYTHONPATH = $pythonTarget
          python -c "import docx; import pptx; import openpyxl"
          where.exe pdftotext.exe

  server-shards:
    name: Server ${{ matrix.shard }}/4
    needs: server-environment
    runs-on: windows-2022
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\mira-python-validation
          key: final-python-3.12-${{ hashFiles('scripts/release/requirements-validation.txt') }}
      - name: Configure server validation paths
        shell: pwsh
        run: |
          $pythonTarget = Join-Path $env:RUNNER_TEMP 'mira-python-validation'
          "PYTHONPATH=$pythonTarget" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          New-Item -ItemType Directory -Force -Path '.test-artifact\server\workspace' | Out-Null
          New-Item -ItemType Directory -Force -Path 'server\.test-artifact' | Out-Null
      - run: pnpm install --frozen-lockfile --prefer-offline --filter @ui-chat-mira/server...
      - name: Run current server shard with fresh coverage
        id: tests
        continue-on-error: true
        run: node scripts/release/run-test-scope.mjs --scope=server --shard=${{ matrix.shard }}/4 --timeout-seconds=480
      - name: Upload server shard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-server-shard-${{ matrix.shard }}-${{ github.sha }}
          path: .artifacts/release-validation/windows-x64/shards/server/${{ matrix.shard }}-of-4
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          include-hidden-files: true
      - name: Enforce test result after evidence upload
        if: always()
        shell: pwsh
        run: if ('${{ steps.tests.outcome }}' -ne 'success') { exit 1 }

  merge-server:
    name: Merge server tests and coverage
    needs: server-shards
    if: always()
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline --filter @ui-chat-mira/server...
      - uses: actions/download-artifact@v4
        with:
          pattern: final-server-shard-*-${{ github.sha }}
          path: .artifacts/release-validation/windows-x64/shards/server
          merge-multiple: true
      - name: Merge server blob reports
        id: merge
        continue-on-error: true
        run: node scripts/release/run-test-scope.mjs --scope=server --merge-dir=.artifacts/release-validation/windows-x64/shards/server --expected-shards=4
      - name: Upload merged server reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-server-merged-${{ github.sha }}
          path: .artifacts/release-validation/windows-x64/reports/server
          if-no-files-found: warn
          retention-days: 1
          include-hidden-files: true
      - name: Enforce merged result after report upload
        if: always()
        shell: pwsh
        run: if ('${{ steps.merge.outcome }}' -ne 'success') { exit 1 }

  final:
    needs:
      - merge-client
      - server-environment
      - merge-server
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Publish bounded validation result
        uses: actions/github-script@v7
        env:
          CLIENT: ${{ needs.merge-client.result }}
          ENVIRONMENT: ${{ needs.server-environment.result }}
          SERVER: ${{ needs.merge-server.result }}
        with:
          script: |
            const results = [process.env.CLIENT, process.env.ENVIRONMENT, process.env.SERVER];
            const passed = results.every((result) => result === 'success');
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: passed ? 'success' : 'failure',
              context: 'release-shard-validation',
              description: passed ? 'Full sharded validation passed' : 'Full sharded validation finished with test failures',
              target_url: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
            });
            if (!passed) core.setFailed(`Validation results: ${results.join(', ')}`);
