name: Inspect Dev R2 Release Contract

on:
  push:
    branches:
      - diagnostic/dev-r2-release-inspect
    paths:
      - '.github/workflows/inspect-dev-r2-release.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  statuses: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 1

      - name: Publish running status
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              context: 'dev-r2-release-inspect',
              description: 'Inspecting dev R2 release contract',
              target_url: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
            });

      - name: Collect R2 release contract
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostics/matches
          find .github/workflows scripts -type f -print | sort > diagnostics/scanned-files.txt
          grep -RInE --exclude='inspect-dev-r2-release.yml' \
            '(R2|r2|Cloudflare|cloudflare|AWS_ACCESS_KEY_ID|AWS_SECRET_ACCESS_KEY|S3_ENDPOINT|s3 cp|s3 sync|wrangler)' \
            .github/workflows scripts > diagnostics/r2-matches.txt || true

          cut -d: -f1 diagnostics/r2-matches.txt | sort -u > diagnostics/matched-files.txt
          while IFS= read -r file; do
            [ -n "$file" ] || continue
            mkdir -p "diagnostics/matches/$(dirname "$file")"
            cp "$file" "diagnostics/matches/$file"
          done < diagnostics/matched-files.txt

          {
            echo '### Dev R2 release inspection'
            echo
            echo 'Matched files:'
            sed 's/^/- /' diagnostics/matched-files.txt
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload inspection
        uses: actions/upload-artifact@v4
        with:
          name: dev-r2-release-contract-${{ github.sha }}
          path: diagnostics
          if-no-files-found: error
          retention-days: 1

      - name: Publish success status
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'success',
              context: 'dev-r2-release-inspect',
              description: 'Dev R2 release contract captured',
              target_url: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
            });
