  - id: WHO_SEMEN_2021
    title: WHO laboratory manual for the examination and processing of human semen, 6th ed.
    url: https://www.who.int/publications/i/item/9789240030787
  - id: ASRM_OVARIAN_RESERVE_2020
    title: Testing and interpreting measures of ovarian reserve: a committee opinion.
    url: https://www.asrm.org/practice-guidance/practice-committee-documents/testing-and-interpreting-measures-of-ovarian-reserve-a-committee-opinion-2020/
  - id: ASRM_FEMALE_EVALUATION_2021
    title: Fertility evaluation of infertile women: a committee opinion.
    url: https://www.asrm.org/practice-guidance/practice-committee-documents/fertility-evaluation-of-infertile-women-a-committee-opinion-2021/
  - id: AUA_ASRM_MALE_2020
    title: Diagnosis and treatment of infertility in men: AUA/ASRM guideline part I.
    url: https://www.asrm.org/practice-guidance/practice-committee-documents/diagnosis-and-treatment-of-infertility-in-men-auaasrm-guideline-part-i-2020/
  - id: ASRM_THYROID_2024
    title: Subclinical hypothyroidism in the infertile female population: a guideline.
    url: https://www.asrm.org/practice-guidance/practice-committee-documents/subclinical-hypothyroidism-in-the-infertile-female-population-a-guideline/
  - id: ACOG_PREPREGNANCY_2019
    title: Prepregnancy Counseling.
    url: https://www.acog.org/clinical/clinical-guidance/committee-opinion/articles/2019/01/prepregnancy-counseling
  - id: ACOG_OVARIAN_AGING_2025
    title: Anticipatory Counseling Regarding Ovarian-Factor Fertility Decline.
    url: https://www.acog.org/clinical/clinical-guidance/committee-statement/articles/2025/11/anticipatory-counseling-regarding-ovarian-factor-fertility-decline
