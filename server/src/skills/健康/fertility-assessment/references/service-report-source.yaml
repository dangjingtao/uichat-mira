version: 1
status: compatibility_reference
runtimeSource: report-profiles.json

service:
  brandName: 圆姐聊女性全周期服务
  teamName: Mira 生育健康评估服务团队
  serviceLine: 备孕从了解自己开始，陪伴你一起接好孕。

intake:
  requiredProfileFields:
    - displayName
    - assessmentScope
    - currentGoal
  optionalInternalFields:
    - reportProfileId
    - scoringProfileId
  assessmentScopeOptions:
    - female
    - male
    - couple
  currentGoalOptions:
    - natural_conception
    - assisted_reproduction
    - failure_review
    - general

reportTheme:
  primaryColor: "#5B2A86"
  secondaryColor: "#D79ACB"
  accentColor: "#8FB5E8"
  softBackground: "#F7F2FA"
  textColor: "#2C2530"
  mutedTextColor: "#766B79"
  headerEnabled: true
  footerEnabled: true
  footerText: 本报告用于健康教育、信息整理和就诊准备，不构成诊断、处方或医疗决策。

reportCover:
  showServiceObject: true
  showAssessmentType: true
  showAssessmentScope: true
  showGeneratedDate: true
  showServiceTeam: true

notes:
  - 本文件保留第一轮设计语义，便于阅读和兼容旧说明。
  - 运行时实际读取 report-profiles.json 与 scoring-profiles.json；技能修改页保存后下一份报告生效。
  - activeProfileId 是全局默认；服务档案可通过 reportProfileId / scoringProfileId 选择已发布 Profile，不应在客户访谈中追问。
  - 请求的 Profile 不存在时回退到 activeProfileId，并写结构化诊断。
  - 修改任何 Source 都不得改变 Conversation Flow、轮次上限、最终确认或报告 handoff。